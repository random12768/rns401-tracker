<div class="top"><span class="badge">Final topic 7</span><span class="lock">Gap-topic practice</span></div>
<h1>Sexual dysfunction, paraphilic disorders, and gender dysphoria</h1><div class="sub">Final topics without a video · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A 28-year-old man reports that for more than 6 months he has ejaculated within about 1 minute of vaginal penetration and has been unable to delay it. He is distressed and avoids intimacy. He has no other sexual difficulty and no medical problems. Which of the following is the most appropriate treatment?", "options": ["A selective serotonin reuptake inhibitor with behavioral techniques such as the stop-start method", "Testosterone", "Sildenafil alone", "Reassurance without treatment", "Bupropion"], "answer": 0, "wrong": {"B": "Testosterone treats hypogonadism and does not delay ejaculation.", "C": "Sildenafil treats erectile dysfunction and has limited benefit here.", "D": "The problem is distressing and treatable.", "E": "Bupropion has no established role and can increase libido."}, "explanation": "Premature (early) ejaculation is treated with behavioral techniques (stop-start and squeeze) and with SSRIs, which delay ejaculation as a side effect. Topical anesthetics are another option.", "objective": "Premature ejaculation: behavioral techniques and SSRIs.", "error_hint": "Students choose a PDE-5 inhibitor because it is the best-known sexual dysfunction drug.", "explanation_short": ""}, {"stem": "A 45-year-old man has been unable to maintain an erection during intercourse for 6 months, beginning after a job loss. He reports waking with erections most mornings and has normal erections when he masturbates. Which of the following is the most likely cause?", "options": ["Hypogonadism", "Psychogenic factors", "Beta-blocker therapy", "Atherosclerotic vascular disease", "Diabetic neuropathy"], "answer": 1, "wrong": {"A": "Hypogonadism would reduce libido and morning erections.", "C": "No medication is described.", "D": "Vascular disease would produce consistent impairment.", "E": "Neuropathy would impair erections in all situations, including nocturnal ones."}, "explanation": "Preserved morning (nocturnal) erections and erections during masturbation indicate that the physiology is intact, so the problem is likely psychogenic, especially with a clear stressor and situational onset. Organic erectile dysfunction is usually gradual, consistent, and affects all situations, including nocturnal erections.", "objective": "Intact morning erections and masturbatory erections suggest a psychogenic cause of erectile dysfunction.", "error_hint": "Students choose organic causes because of age. Situational onset and preserved nocturnal erections point to psychological factors.", "explanation_short": ""}, {"stem": "A 26-year-old woman has been unable to have intercourse because of involuntary tightening of her vaginal muscles whenever penetration is attempted. She fears pain. Pelvic examination attempts cause muscle spasm, but the anatomy is normal. Which of the following is the most appropriate treatment?", "options": ["Estrogen cream alone", "Sildenafil", "An SSRI", "Surgical widening of the introitus", "Graded vaginal dilators with relaxation and desensitization"], "answer": 4, "wrong": {"A": "Estrogen helps atrophic changes, which are not present.", "B": "Sildenafil has no role.", "C": "SSRIs would be used for premature ejaculation and can worsen female sexual function.", "D": "Surgery is not indicated with a normal anatomy."}, "explanation": "This is genito-pelvic pain/penetration disorder (vaginismus). Treatment is graded desensitization with vaginal dilators, relaxation training, CBT, and pelvic floor physical therapy.", "objective": "Vaginismus is treated with graded dilators, relaxation, and desensitization.", "error_hint": "Students look for a drug. The condition is a conditioned muscular response to anticipated pain.", "explanation_short": ""}, {"stem": "A 42-year-old man has been arrested several times for rubbing his genitals against women in crowded subway cars. He reports that for over 6 months he has had recurrent, intense sexual arousal from this activity and has acted on it. Which of the following is the most likely diagnosis?", "options": ["Fetishistic disorder", "Exhibitionistic disorder", "Frotteuristic disorder", "Transvestic disorder", "Voyeuristic disorder"], "answer": 2, "wrong": {"A": "Fetishistic disorder involves arousal from nonliving objects or specific body parts.", "B": "Exhibitionistic disorder involves arousal from exposing one's genitals to an unsuspecting person.", "D": "Transvestic disorder involves arousal from cross-dressing.", "E": "Voyeuristic disorder involves arousal from watching unsuspecting people undress or have sex."}, "explanation": "Frotteuristic disorder is recurrent arousal from touching or rubbing against a nonconsenting person, typically in crowded places. Paraphilic disorders require recurrent, intense arousal for at least 6 months, with acting on the urges or marked distress.", "objective": "Frotteuristic disorder: arousal from rubbing against or touching a nonconsenting person.", "error_hint": "Students choose exhibitionism because it is the best known paraphilia.", "explanation_short": ""}, {"stem": "A 16-year-old assigned female at birth has for as long as they can remember felt that their gender is male. Over the past 2 years they have become depressed and have stopped attending school because of intense distress about the physical changes of puberty. They ask to be called by a male name and to use male pronouns. Which of the following is the most likely diagnosis?", "options": ["Major depressive disorder only", "Fetishistic disorder", "Body dysmorphic disorder", "Gender dysphoria", "Transvestic disorder"], "answer": 3, "wrong": {"A": "Depression may coexist, but the distress is tied to the gender incongruence, which is not explained by depression alone.", "B": "Fetishistic disorder is sexual arousal from objects or non-genital body parts.", "C": "Body dysmorphic disorder is preoccupation with a perceived defect in appearance, not a mismatch of gender.", "E": "Transvestic disorder is sexual arousal from cross-dressing, which is not described."}, "explanation": "Gender dysphoria is clinically significant distress or impairment due to marked incongruence between a person's experienced or expressed gender and their assigned gender, lasting at least 6 months. Gender nonconformity alone is not a disorder; the diagnosis requires distress or functional impairment. Depression and anxiety are common comorbidities and need assessment.", "objective": "Gender dysphoria requires incongruence between experienced and assigned gender with significant distress or impairment.", "error_hint": "Students confuse gender identity with sexual arousal patterns. Gender dysphoria is about identity and distress.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
