<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Personality disorders: Clusters A and C — practice questions</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--dim:#5b6475;--bd:#d9dde8;--ac:#4f46e5;--ok:#15803d;--okb:#e7f6ec;--bad:#b91c1c;--badb:#fdecec;--hint:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--dim:#9aa3b8;--bd:#2c3140;--ac:#818cf8;--ok:#4ade80;--okb:#12301e;--bad:#f87171;--badb:#341818;--hint:#2f2a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:700}
.lock{font-size:.78em;color:var(--dim)}
h1{font-size:1.45em;margin:.2em 0 .1em}
.sub{color:var(--dim);font-size:.9em;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.qn{font-weight:700;color:var(--ac);font-size:.85em;margin-bottom:4px}
.stem{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-top:5px}.opt .l{font-weight:700;min-width:1.2em}
.q.done .opt{cursor:default}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin:4px 0 0 0;font-size:.88em;color:var(--dim)}
.opt.right .why,.opt.wrong .why{color:var(--tx)}
.res{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.q.done .res{display:block}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.92em}
.obj{background:var(--okb)}.err{background:var(--hint)}
.lbl{font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);display:block}
.flags{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:.9em}
.flags h2{font-size:1em;margin:0 0 6px}.flags li{margin:4px 0}
.fin{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:14px;margin:14px 0;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 1</span><span class="lock">Gap-topic practice</span></div>
<h1>Personality disorders: Clusters A and C</h1><div class="sub">Personality Disorders · 6 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A 28-year-old man is brought to the clinic by his sister because she is worried that he has no friends. He works nights stocking shelves, lives alone, and eats most meals by himself. He says he has never wanted close relationships, including sexual ones, and he is indifferent to praise or criticism from his supervisor. He has a flat, restricted affect. He has no hallucinations, delusions, or odd beliefs, and he is not distressed by his life. Which of the following is the most likely diagnosis?", "options": ["Schizoid personality disorder", "Avoidant personality disorder", "Schizotypal personality disorder", "Paranoid personality disorder", "Schizophreniform disorder"], "answer": 0, "wrong": {"B": "Avoidant patients want close relationships but stay away because they fear rejection and feel inadequate. This man has no such desire.", "C": "Schizotypal patients have eccentric behavior, magical thinking, odd speech, and perceptual distortions, along with social anxiety. None of these are present.", "D": "Paranoid patients are pervasively distrustful and suspicious of others' motives. Nothing here suggests suspicion.", "E": "Schizophreniform disorder requires psychotic symptoms such as delusions or hallucinations for 1 to 6 months. He has no psychosis and a lifelong pattern."}, "explanation": "Schizoid personality disorder is a pervasive pattern of detachment from social relationships with a restricted range of emotional expression. These patients genuinely prefer solitude, take little pleasure in activities, and are indifferent to praise or criticism. Like other personality disorders it is ego-syntonic, so the patient is not bothered by it. The absence of odd beliefs or perceptual disturbances separates it from schizotypal disorder.", "objective": "Distinguish schizoid (no desire for closeness) from avoidant (desires closeness but fears rejection) and schizotypal (eccentric, odd beliefs).", "error_hint": "Students pick avoidant because both patients are socially isolated, and miss that the motive differs: he does not want relationships, while the avoidant patient is afraid of them.", "explanation_short": ""}, {"stem": "A 36-year-old woman is seen for a routine visit. At her last job she was fired after accusing a co-worker of deliberately giving her unclear instructions so she would fail. She refuses to give her employer personal information because she thinks it will be used against her, and she still holds a grudge against a neighbor for a minor remark made years ago. She is otherwise functioning and has no hallucinations. Her thinking is organized, and she has no fixed false belief about a specific plot. Which of the following is the most likely diagnosis?", "options": ["Paranoid personality disorder", "Narcissistic personality disorder", "Delusional disorder, persecutory type", "Borderline personality disorder", "Schizotypal personality disorder"], "answer": 0, "wrong": {"B": "Narcissistic patients show grandiosity, a need for admiration, and lack of empathy. These are not described.", "C": "Delusional disorder involves a fixed, non-bizarre delusion (for example, a specific plot) while the rest of functioning is relatively preserved. Her suspicion is a general trait, not one fixed belief.", "D": "Borderline patients have unstable relationships, identity, and mood with impulsivity and self-harm. Her problem is distrust, not instability.", "E": "Schizotypal patients have eccentric appearance, magical thinking, and odd speech. She shows none of these."}, "explanation": "Paranoid personality disorder is a long-standing, pervasive distrust and suspicion in which others' motives are interpreted as malicious. Patients are reluctant to confide, read hidden meanings into benign remarks, and bear grudges. There is no fixed delusion and no hallucination, and the thinking is organized.", "objective": "Paranoid personality disorder is pervasive distrust without psychosis; a single fixed false belief points instead to delusional disorder.", "error_hint": "Students label any persecutory thinking as delusional disorder. Ask whether there is one fixed false belief (delusional disorder) or a general trait of suspicion (paranoid personality disorder).", "explanation_short": ""}, {"stem": "A 45-year-old accountant is referred by his wife, who says he is impossible to live with. He works 70 hours a week, rewrites reports until they are perfect, and misses deadlines because he cannot let them go. He insists that his family load the dishwasher exactly his way and keeps long lists of household rules. He is rigid about money and refuses to throw away worn-out items. He does not have repetitive hand-washing, checking, or intrusive thoughts, and he does not feel that his behavior is a problem. Which of the following is the most likely diagnosis?", "options": ["Avoidant personality disorder", "Obsessive-compulsive disorder", "Obsessive-compulsive personality disorder", "Schizoid personality disorder", "Narcissistic personality disorder"], "answer": 2, "wrong": {"A": "Avoidant patients avoid social contact because they fear criticism. He is not avoiding people.", "B": "OCD is characterized by true obsessions and compulsive rituals that the patient recognizes as excessive and finds distressing (ego-dystonic). He has neither the rituals nor the distress.", "D": "Schizoid patients are detached and indifferent to relationships. His difficulty is rigid control, not detachment.", "E": "Narcissistic patients seek admiration and feel entitled. His behavior is driven by rules and perfectionism instead."}, "explanation": "Obsessive-compulsive personality disorder (OCPD) is a pervasive preoccupation with orderliness, perfectionism, and control at the expense of flexibility and efficiency. It is ego-syntonic: the patient believes his way is correct. Workaholism, rigidity, hoarding money and objects, and an insistence that others follow his methods are typical. Obsessions and compulsions as such are absent.", "objective": "OCPD is ego-syntonic perfectionism and control with no true obsessions or compulsions; OCD is ego-dystonic.", "error_hint": "Students choose OCD because of the name. The key is that OCD patients are distressed by their rituals, while OCPD patients think they are right.", "explanation_short": ""}, {"stem": "A 32-year-old woman comes to the clinic after her boyfriend ended their relationship of 2 weeks. She says she cannot make a decision about what to wear or whether to take a job without first asking several friends what they think. She has always lived with a partner or her parents and begins a new relationship soon after each one ends because she is afraid she cannot care for herself. At work she volunteers for unpleasant tasks so that people will like her. She has not had self-harm, intense anger, or episodes of abrupt idealization and devaluation. Which of the following is the most likely diagnosis?", "options": ["Avoidant personality disorder", "Borderline personality disorder", "Obsessive-compulsive personality disorder", "Dependent personality disorder", "Histrionic personality disorder"], "answer": 3, "wrong": {"A": "Avoidant patients withdraw from others for fear of criticism. She seeks out others and clings to them.", "B": "Borderline patients show unstable relationships with idealization and devaluation, identity disturbance, impulsivity, anger, and self-harm. These are explicitly absent.", "C": "OCPD is rigid perfectionism and control. She is submissive and indecisive.", "E": "Histrionic patients are attention-seeking, dramatic, and seductive with shallow, shifting emotions. She is submissive, not dramatic."}, "explanation": "Dependent personality disorder is a pervasive need to be taken care of, producing submissive and clinging behavior, difficulty making everyday decisions without reassurance, and an urgent search for a new relationship when one ends. It belongs to cluster C (anxious or fearful).", "objective": "Dependent personality disorder: needs reassurance for decisions, fears being alone, quickly seeks another relationship after a breakup.", "error_hint": "Students pick borderline because of the fear of abandonment. The absence of self-harm, anger, and idealization/devaluation, together with submissiveness, points to dependent.", "explanation_short": ""}, {"stem": "A 30-year-old man is brought for evaluation after his family noticed that he has become more isolated. He says he can sense when his mother is thinking about him, even when she is in another city. He wears several mismatched layers of clothing, speaks in vague, overly elaborate language, and has no close friends other than his mother. He becomes very anxious at social gatherings, but the anxiety does not lessen as he gets to know people. He has had no sustained hallucinations or delusions. Which of the following conditions is most likely to occur with increased frequency among his first-degree relatives?", "options": ["Attention-deficit/hyperactivity disorder", "Antisocial personality disorder", "Bipolar I disorder", "Obsessive-compulsive disorder", "Schizophrenia"], "answer": 4, "wrong": {"A": "ADHD is familial but unrelated to schizotypal personality disorder.", "B": "Antisocial personality disorder clusters with substance use and somatic symptom disorders in families, not with the schizophrenia spectrum.", "C": "Bipolar disorder runs in families but is a mood disorder. It is not the spectrum partner of schizotypal personality disorder.", "D": "OCD has its own familial pattern but is not linked to schizotypal disorder."}, "explanation": "This man has schizotypal personality disorder: eccentric appearance, odd speech, magical thinking (a belief in telepathy), and social anxiety that does not improve with familiarity. It is a cluster A disorder and is part of the schizophrenia spectrum, with a higher prevalence among first-degree relatives of people with schizophrenia. Patients may briefly become psychotic but do not have the sustained psychosis that defines schizophrenia.", "objective": "Schizotypal personality disorder is associated with a higher prevalence of schizophrenia in first-degree relatives.", "error_hint": "Students look for the most severe disorder in the relatives and miss that the family-history link is specifically to schizophrenia.", "explanation_short": ""}, {"stem": "A 40-year-old woman is evaluated at the request of her supervisor. She rarely initiates conversation at work and has declined two promotions because they would require giving presentations. She longs for close friends but will only join a group if she is sure she will be liked, and she fears she will be embarrassed or ridiculed. She considers herself socially inept and inferior to others. Which of the following is the most likely diagnosis?", "options": ["Dependent personality disorder", "Avoidant personality disorder", "Paranoid personality disorder", "Schizotypal personality disorder", "Schizoid personality disorder"], "answer": 1, "wrong": {"A": "Dependent patients cling to others and need reassurance to make decisions. She avoids people instead.", "C": "Paranoid patients distrust others' motives. She fears being rejected, not being harmed.", "D": "Schizotypal patients have eccentric behavior and magical thinking. These are not described.", "E": "Schizoid patients do not want relationships and are indifferent to criticism."}, "explanation": "Avoidant personality disorder is a pervasive pattern of social inhibition, feelings of inadequacy, and hypersensitivity to negative evaluation. In contrast to schizoid patients, avoidant patients desire relationships but stay away from them for fear of rejection. It is a cluster C disorder.", "objective": "Avoidant personality disorder: desires relationships, avoids them because of fear of rejection and feelings of inadequacy.", "error_hint": "Students pick schizoid because both avoid people. The difference is the desire for closeness.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
