<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Psychiatric assessment and the mental status examination — practice questions</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--dim:#5b6475;--bd:#d9dde8;--ac:#4f46e5;--ok:#15803d;--okb:#e7f6ec;--bad:#b91c1c;--badb:#fdecec;--hint:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--dim:#9aa3b8;--bd:#2c3140;--ac:#818cf8;--ok:#4ade80;--okb:#12301e;--bad:#f87171;--badb:#341818;--hint:#2f2a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:700}
.lock{font-size:.78em;color:var(--dim)}
h1{font-size:1.45em;margin:.2em 0 .1em}
.sub{color:var(--dim);font-size:.9em;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.qn{font-weight:700;color:var(--ac);font-size:.85em;margin-bottom:4px}
.stem{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-top:5px}.opt .l{font-weight:700;min-width:1.2em}
.q.done .opt{cursor:default}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin:4px 0 0 0;font-size:.88em;color:var(--dim)}
.opt.right .why,.opt.wrong .why{color:var(--tx)}
.res{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.q.done .res{display:block}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.92em}
.obj{background:var(--okb)}.err{background:var(--hint)}
.lbl{font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);display:block}
.flags{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:.9em}
.flags h2{font-size:1em;margin:0 0 6px}.flags li{margin:4px 0}
.fin{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:14px;margin:14px 0;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 7</span><span class="lock">Gap-topic practice</span></div>
<h1>Psychiatric assessment and the mental status examination</h1><div class="sub">Final topics without a video · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A 50-year-old man is asked what he does for work. He replies, \"Well, I leave home at 7, take the highway because of the construction on Main Street, the weather was nice today, there was a lot of traffic at the bridge, I park in the garage on the corner, and finally I get to the office where I work as an accountant.\" Which of the following terms best describes his thought process?", "options": ["Thought blocking", "Tangentiality", "Loose associations", "Circumstantiality", "Flight of ideas"], "answer": 3, "wrong": {"A": "Thought blocking is an abrupt interruption in the flow of thoughts or speech.", "B": "Tangentiality is going off topic and never answering the question.", "C": "Loose associations (derailment) are illogical shifts between unrelated topics, characteristic of schizophrenia.", "E": "Flight of ideas is rapid, pressured speech with abrupt but understandable shifts, typical of mania."}, "explanation": "Circumstantiality is excessive, unnecessary detail, but the speaker eventually returns to the point and answers the question. It is seen in obsessional personality and some anxiety states. In tangentiality, the person strays and never returns to the question.", "objective": "Circumstantiality: excessive detail, but the speaker reaches the point; tangentiality never gets there.", "error_hint": "Students pick tangentiality because of the digressions. Only circumstantiality returns to the answer.", "explanation_short": ""}, {"stem": "A 78-year-old woman is evaluated on the second day after hip surgery. She is drowsy in the morning and agitated in the evening. She cannot recite the months of the year backward, talks incoherently, and says there are people in the room who are not there. Which of the following mental status findings is most characteristic of her condition?", "options": ["Normal level of consciousness with isolated memory loss", "Fluctuating level of consciousness with impaired attention", "Fixed delusions with a clear sensorium", "Elevated mood and decreased need for sleep", "Flat affect with poverty of speech"], "answer": 1, "wrong": {"A": "Dementia typically presents with memory loss and a normal level of consciousness.", "C": "Fixed delusions with a clear sensorium suggests a primary psychotic disorder.", "D": "Elevated mood with decreased need for sleep suggests mania.", "E": "Flat affect and poverty of speech are negative symptoms of schizophrenia."}, "explanation": "This is delirium: an acute, fluctuating disturbance in attention and awareness (clouded consciousness) with disorganized thinking and often perceptual disturbances. Impaired attention (such as inability to recite the months backward) is the core feature. Causes include infection, medications, surgery, and metabolic derangements.", "objective": "Delirium: acute onset, fluctuating consciousness, impaired attention.", "error_hint": "Students call it dementia because of age. The acute course, fluctuating alertness, and inattention indicate delirium.", "explanation_short": ""}, {"stem": "A patient with a progressive neurocognitive disorder is brought to the clinic. Which of the following aspects of orientation is typically lost first?", "options": ["Orientation to self and place together", "Orientation to place", "Orientation to person", "Orientation to all three at once", "Orientation to time"], "answer": 4, "wrong": {"A": "Self is the last to go.", "B": "Place is lost after time.", "C": "Orientation to person is usually preserved until the late stages.", "D": "Loss is usually progressive, not all at once."}, "explanation": "In cognitive impairment, orientation is lost in a typical order: first time (date, day), then place, and last person (own name). Recovery follows the reverse order.", "objective": "Orientation is lost in the order time, place, person.", "error_hint": "Students expect the most basic information to go first. Person is the last to be lost.", "explanation_short": ""}, {"stem": "A psychologist shows a patient a series of ambiguous drawings of people in various scenes and asks her to tell a story about each. The psychologist then interprets the themes to assess her motivations and conflicts. Which of the following tests is being used?", "options": ["Thematic Apperception Test", "Minnesota Multiphasic Personality Inventory-2", "Rorschach test", "Beck Depression Inventory", "Wechsler Adult Intelligence Scale"], "answer": 0, "wrong": {"B": "The MMPI-2 is an objective true/false questionnaire.", "C": "The Rorschach test uses inkblots, not pictures of people.", "D": "The Beck Depression Inventory is a self-report depression scale.", "E": "The WAIS measures intelligence."}, "explanation": "The Thematic Apperception Test (TAT) is a projective test in which patients create stories about ambiguous pictures, revealing themes and unconscious conflicts. The Rorschach uses inkblots. The MMPI-2 is an objective, self-report personality inventory.", "objective": "TAT: stories about ambiguous pictures; Rorschach: inkblots; MMPI-2: objective self-report.", "error_hint": "Students choose Rorschach because it is the better-known projective test.", "explanation_short": ""}, {"stem": "A child's score on an intelligence test is 130. The test has a mean of 100 and a standard deviation of 15. Approximately where does this score fall in the population distribution?", "options": ["95th percentile", "50th percentile", "98th percentile", "99.9th percentile", "84th percentile"], "answer": 2, "wrong": {"A": "The 95th percentile is about 1.65 SD above the mean (about 125).", "B": "The 50th percentile is the mean (100).", "D": "The 99.9th percentile is 3 SD above the mean (145).", "E": "The 84th percentile is 1 SD above the mean (115)."}, "explanation": "A score of 130 is 2 standard deviations above the mean. About 95% of a normal distribution lies within 2 SD, so about 2.5% lie above, placing the score at about the 97.5th to 98th percentile. By the same logic, an IQ of 70 (2 SD below the mean) with deficits in adaptive functioning suggests intellectual disability.", "objective": "IQ mean is 100 with SD 15; 130 is about the 98th percentile.", "error_hint": "Students mix up SD values and percentiles: 1 SD is the 84th percentile, 2 SD is the 98th, 3 SD is the 99.9th.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
