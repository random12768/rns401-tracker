<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Elder abuse and intimate partner violence — practice questions</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--dim:#5b6475;--bd:#d9dde8;--ac:#4f46e5;--ok:#15803d;--okb:#e7f6ec;--bad:#b91c1c;--badb:#fdecec;--hint:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--dim:#9aa3b8;--bd:#2c3140;--ac:#818cf8;--ok:#4ade80;--okb:#12301e;--bad:#f87171;--badb:#341818;--hint:#2f2a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:700}
.lock{font-size:.78em;color:var(--dim)}
h1{font-size:1.45em;margin:.2em 0 .1em}
.sub{color:var(--dim);font-size:.9em;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.qn{font-weight:700;color:var(--ac);font-size:.85em;margin-bottom:4px}
.stem{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-top:5px}.opt .l{font-weight:700;min-width:1.2em}
.q.done .opt{cursor:default}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin:4px 0 0 0;font-size:.88em;color:var(--dim)}
.opt.right .why,.opt.wrong .why{color:var(--tx)}
.res{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.q.done .res{display:block}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.92em}
.obj{background:var(--okb)}.err{background:var(--hint)}
.lbl{font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);display:block}
.flags{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:.9em}
.flags h2{font-size:1em;margin:0 0 6px}.flags li{margin:4px 0}
.fin{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:14px;margin:14px 0;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 5</span><span class="lock">Gap-topic practice</span></div>
<h1>Elder abuse and intimate partner violence</h1><div class="sub">Abuse & Neglect · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "An 82-year-old woman with mild dementia is brought to the emergency department by her son, with whom she lives. She is dehydrated and underweight and has a stage 3 sacral pressure ulcer and poor hygiene. The son says she refuses to eat and will not let him help. The physician suspects neglect. Which of the following is the most appropriate next step?", "options": ["Ask the son to sign a statement that he has cared for her properly", "Confront the son and accuse him of abuse", "Discharge her with home nursing and no further action", "Interview her alone to assess safety and her wishes, then report the suspected neglect to adult protective services", "Wait until she asks for help"], "answer": 3, "wrong": {"A": "A signed statement provides no safety.", "B": "Accusing the caregiver is unhelpful and may endanger the patient. Suspicion, not proof, is enough to report.", "C": "Sending her home without action leaves her in a potentially unsafe situation.", "E": "Dementia and dependence may prevent her from asking, and waiting delays protection."}, "explanation": "Neglect (failure to provide food, hydration, hygiene, or medical care) is the most common form of elder abuse. The physician should interview the patient privately, assess her safety, capacity, and wishes, treat her conditions, and report suspected abuse or neglect to adult protective services. Most states mandate reporting for physicians.", "objective": "Interview the elderly patient alone and report suspected abuse or neglect to adult protective services.", "error_hint": "Students want proof first or hope the patient will ask. Reasonable suspicion requires action.", "explanation_short": ""}, {"stem": "A geriatrician is lecturing about elder abuse. Which of the following is the most common perpetrator of elder abuse?", "options": ["Paid home health aides", "Strangers", "Neighbors", "Staff at long-term care facilities", "Family members, most often adult children or spouses"], "answer": 4, "wrong": {"A": "Paid aides are less often the perpetrators than family.", "B": "Strangers are rarely the source.", "C": "Neighbors are uncommon perpetrators.", "D": "Facility abuse occurs, but it is less common than abuse by family."}, "explanation": "Most elder abuse is committed by family members, typically adult children and spouses, who are often caregivers and sometimes have financial, substance use, or stress-related risk factors. Risk factors in victims include dementia, dependence, and social isolation.", "objective": "Elder abuse is most commonly committed by family members, often adult children.", "error_hint": "Students think of nursing homes. Most abuse occurs in the community by relatives.", "explanation_short": ""}, {"stem": "A 31-year-old woman is seen in the emergency department for the third time this year with a fractured wrist. She is evasive about how she was injured. After the physician speaks with her alone she admits that her husband beat her last night. Two days ago he had been pleading and bringing her flowers after the previous episode, promising never to hurt her again, and she believed him. Which phase of the cycle of violence did she describe after the previous episode?", "options": ["Honeymoon (reconciliation) phase", "Latency phase", "Tension-building phase", "Acute battering phase", "Escalation phase"], "answer": 0, "wrong": {"B": "Latency is not part of the cycle.", "C": "Tension building is characterized by increasing arguments and anxiety before violence.", "D": "The acute battering phase is the violent incident itself.", "E": "Escalation is not a named phase."}, "explanation": "The cycle of domestic violence consists of tension building (minor incidents, escalating tension), acute battering (the violent episode), and a honeymoon or reconciliation phase in which the abuser is apologetic and loving, promises to change, and the victim hopes the violence will stop. This phase often keeps victims in the relationship.", "objective": "The cycle of violence has three phases: tension building, acute battering, and honeymoon.", "error_hint": "Students pick the phase that sounds worst. The apologetic, loving behavior defines the honeymoon phase.", "explanation_short": ""}, {"stem": "A 28-year-old woman discloses to her physician that her partner repeatedly hits her. She has a bruise on her upper arm. She is competent, does not want the police involved, and asks that nothing be told to anyone. She says she is afraid to go home tonight. Which of the following is the most appropriate action?", "options": ["Prescribe an anxiolytic and schedule a follow-up in 6 months", "Assess her immediate safety, document the injuries, provide resources and safety planning, and respect her confidentiality", "Refer the couple for joint counseling", "Report the abuse to the police against her wishes", "Tell her she must leave the relationship today"], "answer": 1, "wrong": {"A": "Medication and delayed follow-up do not address safety.", "C": "Couples counseling is not recommended while violence is ongoing, because it can increase danger.", "D": "Breaking confidentiality without consent or legal requirement can increase her danger.", "E": "Telling her to leave is directive and ignores that leaving is the period of highest risk."}, "explanation": "For a competent adult victim of intimate partner violence, the physician should assess immediate danger, document findings thoroughly (they may be needed later), provide hotline and shelter information, help develop a safety plan, and respect her autonomy and confidentiality. Mandatory reporting laws for adult partner abuse are limited in most states, usually to specific injuries such as gunshot or stab wounds.", "objective": "For a competent adult IPV victim, assess safety, document, offer resources, and respect confidentiality unless the law requires a report.", "error_hint": "Students apply the child-abuse rule (mandatory report) to adult victims.", "explanation_short": ""}, {"stem": "A 22-year-old woman comes to the emergency department 12 hours after being sexually assaulted by an acquaintance. She has not bathed and is undecided about contacting the police. Which of the following is the most appropriate management?", "options": ["Delay all evaluation until she decides about the police", "Advise her to bathe and return in a week", "Offer emergency contraception and prophylaxis for sexually transmitted infections, and collect forensic evidence with her consent whether or not she reports", "Require a police report before treatment", "Treat only physical injuries and refer her to counseling"], "answer": 2, "wrong": {"A": "Delaying evaluation risks loss of evidence and effectiveness of prophylaxis.", "B": "Bathing destroys evidence and delays care.", "D": "Medical care cannot be conditional on a police report.", "E": "Prophylaxis and evidence collection are time-sensitive and are part of the care."}, "explanation": "The care of a sexual assault survivor includes treating injuries, offering emergency contraception and prophylaxis for STIs (and consideration of HIV post-exposure prophylaxis), collecting forensic evidence with consent, documentation, and offering counseling and follow-up. Evidence collection can be done without a police report, and treatment is not conditional on one. Most assailants are known to the victim.", "objective": "Care for sexual assault includes emergency contraception, STI prophylaxis, and consent-based evidence collection regardless of a police report.", "error_hint": "Students make care depend on reporting or delay it, losing time-sensitive treatment and evidence.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
