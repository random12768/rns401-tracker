*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}

</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 2</span><span class="lock">Gap-topic practice</span></div>
<h1>Alcohol: withdrawal, Wernicke, and treatment</h1><div class="sub">Substance Use & Eating Disorders · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A 45-year-old man is hospitalized after a hip fracture. On hospital day 3 he is agitated, diaphoretic, and tremulous. Temperature is 38.1 C (100.6 F), pulse is 118/min, and blood pressure is 160/95 mm Hg. He is disoriented to place and time and says that insects are crawling on the wall. His wife says he drinks a pint of whiskey daily. Which of the following is the most appropriate pharmacotherapy?", "options": ["Naltrexone", "Phenytoin", "Lorazepam", "Propranolol", "Haloperidol"], "answer": 2, "wrong": {"A": "Naltrexone reduces cravings for relapse prevention. It has no role in acute withdrawal.", "B": "Phenytoin is ineffective for alcohol withdrawal seizures, which are best prevented and treated with benzodiazepines.", "D": "Beta-blockers can mask autonomic signs but do not prevent seizures or delirium and can hide worsening withdrawal.", "E": "Antipsychotics can control hallucinations as an adjunct but lower the seizure threshold and do not treat the underlying withdrawal. They are not used alone."}, "explanation": "This is alcohol withdrawal delirium (delirium tremens), which typically begins 2 to 4 days after the last drink and carries real mortality. Benzodiazepines are the treatment of choice because they cross-tolerate with alcohol and prevent seizures and progression. Lorazepam is often preferred in patients with liver disease because it is conjugated rather than oxidized, so it does not accumulate.", "objective": "Benzodiazepines are the treatment for alcohol withdrawal and delirium tremens.", "error_hint": "Students give an antipsychotic because of the hallucinations. The delirium comes from withdrawal, which needs a benzodiazepine.", "explanation_short": ""}, {"stem": "A 58-year-old homeless man is found confused in a shelter. He has an unsteady, wide-based gait and bilateral lateral rectus palsies. He cannot give a coherent history. His breath smells of alcohol and he appears malnourished. A fingerstick glucose is 70 mg/dL. Which of the following is the most appropriate next step in management?", "options": ["Intravenous thiamine", "Intravenous naloxone", "Intravenous dextrose before any other treatment", "Intravenous haloperidol", "Oral folate"], "answer": 0, "wrong": {"B": "Naloxone reverses opioid overdose. There is no respiratory depression or pinpoint pupils.", "C": "Giving glucose first can precipitate Wernicke encephalopathy in thiamine-deficient patients. His glucose is also not low enough to require emergency treatment.", "D": "An antipsychotic does not address the cause and may lower the seizure threshold.", "E": "Folate is often given in malnourished drinkers but does not treat Wernicke encephalopathy."}, "explanation": "Confusion, ataxia, and ophthalmoplegia in a malnourished drinker are the triad of Wernicke encephalopathy, caused by thiamine (B1) deficiency. Thiamine should be given before or with glucose, because a glucose load in a thiamine-deficient patient can precipitate or worsen Wernicke encephalopathy. Untreated, it can progress to Korsakoff syndrome (irreversible anterograde and retrograde amnesia with confabulation).", "objective": "Give thiamine before glucose in an alcoholic patient with confusion, ataxia, and ophthalmoplegia.", "error_hint": "Students treat the low-normal glucose first. In a malnourished drinker thiamine must come first or at the same time.", "explanation_short": ""}, {"stem": "A 50-year-old man with alcohol use disorder has been abstinent for 2 weeks after hospitalization and asks for medication to help him avoid relapse. He has cirrhosis with an AST of 130 U/L and an ALT of 75 U/L. He does not use opioids. Which of the following is the most appropriate medication?", "options": ["Naltrexone", "Acamprosate", "Disulfiram", "Lorazepam", "Buprenorphine"], "answer": 1, "wrong": {"A": "Naltrexone, an opioid antagonist, reduces cravings and is also effective, but it carries a risk of hepatotoxicity and is avoided in patients with significant liver disease or acute hepatitis.", "C": "Disulfiram blocks aldehyde dehydrogenase, causing a toxic reaction with alcohol, and is itself hepatotoxic. It also depends on adherence.", "D": "Benzodiazepines are used for withdrawal. Long-term use leads to dependence and cross-tolerance with alcohol.", "E": "Buprenorphine treats opioid use disorder and is not used for alcohol use disorder."}, "explanation": "Acamprosate modulates glutamatergic (NMDA) and GABA activity and reduces cravings. It is cleared by the kidney, so it can be used in liver disease, and it does not require the patient to be opioid-free. Naltrexone and disulfiram are metabolized by the liver and can cause hepatotoxicity.", "objective": "Acamprosate is renally cleared and preferred for relapse prevention in alcohol use disorder with liver disease.", "error_hint": "Students choose naltrexone because it is the first drug they remember. The liver disease changes the choice.", "explanation_short": ""}, {"stem": "A 34-year-old woman is being treated with metronidazole for bacterial vaginosis. She drinks a glass of wine at dinner and within 20 minutes develops facial flushing, throbbing headache, nausea, and palpitations. These symptoms are most likely caused by which of the following mechanisms?", "options": ["Induction of alcohol dehydrogenase", "Inhibition of CYP2E1", "Blockade of GABA-A receptors", "Inhibition of aldehyde dehydrogenase", "Activation of opioid receptors"], "answer": 3, "wrong": {"A": "Induction of alcohol dehydrogenase would speed up the first step of ethanol metabolism and would not cause acetaldehyde to build up.", "B": "CYP2E1 is the microsomal ethanol-oxidizing system. Inhibition would not explain acetaldehyde accumulation.", "C": "Blocking GABA-A receptors would cause excitation or seizures, not a flushing reaction.", "E": "Opioid receptor activation causes sedation, miosis, and respiratory depression."}, "explanation": "Metronidazole can cause a disulfiram-like reaction by inhibiting aldehyde dehydrogenase. Acetaldehyde accumulates, causing flushing, headache, nausea, vomiting, and tachycardia. Disulfiram itself works this way and is used to discourage drinking.", "objective": "Disulfiram and disulfiram-like drugs inhibit aldehyde dehydrogenase, causing acetaldehyde buildup.", "error_hint": "Students choose alcohol dehydrogenase because it is the better-known enzyme. The reaction comes from the second step, acetaldehyde to acetate.", "explanation_short": ""}, {"stem": "A newborn has microcephaly, short palpebral fissures, a smooth philtrum, and a thin upper lip. The mother admits that she drank two to three glasses of wine most evenings in the first trimester but stopped drinking when she learned she was pregnant at 14 weeks. She asks whether drinking now in small amounts is safe in her next pregnancy. Which of the following is the most accurate response?", "options": ["Only binge drinking is harmful", "Alcohol is harmful only during the first trimester", "Wine is safer than spirits", "Drinking is safe once the neural tube has closed", "No amount of alcohol has been established as safe at any stage of pregnancy"], "answer": 4, "wrong": {"A": "Binge drinking is the highest risk, but lower levels have also been linked to adverse outcomes, and no threshold has been shown to be safe.", "B": "Exposure in the first trimester causes the most severe structural malformations, but the brain remains vulnerable throughout pregnancy.", "C": "The type of beverage does not matter. The risk comes from the ethanol.", "D": "Neural tube closure is complete by about 6 weeks, but later exposure still harms the developing brain."}, "explanation": "This is fetal alcohol syndrome, a leading preventable cause of intellectual disability. Alcohol is a teratogen throughout pregnancy, and no safe amount or time has been identified. The brain develops throughout gestation, so exposure at any stage can cause neurodevelopmental harm. The recommendation is to abstain entirely.", "objective": "No safe level of alcohol in pregnancy has been identified; advise complete abstinence.", "error_hint": "Students look for a safe window or beverage. The correct counseling is simple: no alcohol at any point.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
