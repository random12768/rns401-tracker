<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Learning theory: conditioning and treatment — practice questions</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--dim:#5b6475;--bd:#d9dde8;--ac:#4f46e5;--ok:#15803d;--okb:#e7f6ec;--bad:#b91c1c;--badb:#fdecec;--hint:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--dim:#9aa3b8;--bd:#2c3140;--ac:#818cf8;--ok:#4ade80;--okb:#12301e;--bad:#f87171;--badb:#341818;--hint:#2f2a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:700}
.lock{font-size:.78em;color:var(--dim)}
h1{font-size:1.45em;margin:.2em 0 .1em}
.sub{color:var(--dim);font-size:.9em;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.qn{font-weight:700;color:var(--ac);font-size:.85em;margin-bottom:4px}
.stem{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-top:5px}.opt .l{font-weight:700;min-width:1.2em}
.q.done .opt{cursor:default}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin:4px 0 0 0;font-size:.88em;color:var(--dim)}
.opt.right .why,.opt.wrong .why{color:var(--tx)}
.res{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.q.done .res{display:block}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.92em}
.obj{background:var(--okb)}.err{background:var(--hint)}
.lbl{font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);display:block}
.flags{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:.9em}
.flags h2{font-size:1em;margin:0 0 6px}.flags li{margin:4px 0}
.fin{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:14px;margin:14px 0;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 4</span><span class="lock">Gap-topic practice</span></div>
<h1>Learning theory: conditioning and treatment</h1><div class="sub">Learning Theories & Defense Mechanisms · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A 55-year-old man spends hours at a slot machine. The machine pays out after an unpredictable number of pulls. He keeps playing even after many losses. Which of the following reinforcement schedules best explains his behavior?", "options": ["Fixed interval", "Variable interval", "Variable ratio", "Fixed ratio", "Continuous reinforcement"], "answer": 2, "wrong": {"A": "A fixed interval rewards the first response after a set time, giving a scalloped pattern.", "B": "A variable interval rewards after unpredictable time periods and produces a steady, moderate response rate.", "D": "A fixed ratio rewards after a set number of responses (for example, piecework pay), giving a high rate with pauses after the reward.", "E": "Continuous reinforcement gives a reward every time and is the fastest way to teach a behavior, but behavior extinguishes quickly when it stops."}, "explanation": "A variable-ratio schedule reinforces a behavior after an unpredictable number of responses. It produces the highest rate of responding and the greatest resistance to extinction, which is why gambling is so persistent.", "objective": "Variable-ratio reinforcement gives the highest response rate and the greatest resistance to extinction.", "error_hint": "Students pick variable interval because the payout is unpredictable. The payout depends on the number of pulls, not on elapsed time.", "explanation_short": ""}, {"stem": "A 9-year-old boy cleans his room every evening immediately after his mother begins to nag him. Once he cleans, the nagging stops. Which of the following best describes this process?", "options": ["Negative reinforcement", "Positive reinforcement", "Punishment", "Classical conditioning", "Extinction"], "answer": 0, "wrong": {"B": "Positive reinforcement adds a pleasant stimulus, such as praise, after the behavior.", "C": "Punishment decreases the behavior; here the behavior is increasing.", "D": "Classical conditioning pairs a neutral stimulus with an involuntary response and does not depend on the consequence of a voluntary behavior.", "E": "Extinction is the loss of a learned behavior when reinforcement stops."}, "explanation": "Negative reinforcement strengthens a behavior by removing an unpleasant stimulus (the nagging). Reinforcement, positive or negative, always increases the behavior. Punishment decreases a behavior.", "objective": "Negative reinforcement increases a behavior by removing an aversive stimulus; it is not punishment.", "error_hint": "Students confuse negative reinforcement with punishment because both involve something unpleasant.", "explanation_short": ""}, {"stem": "A 30-year-old woman develops severe vomiting 4 hours after eating a salad with a vinaigrette dressing at a restaurant. Weeks later, she becomes nauseated whenever she smells vinegar. In this scenario, the smell of vinegar is best described as which of the following?", "options": ["Unconditioned stimulus", "Unconditioned response", "Conditioned response", "Conditioned stimulus", "Negative reinforcer"], "answer": 3, "wrong": {"A": "The unconditioned stimulus is the toxin or illness that naturally causes vomiting.", "B": "The unconditioned response is the vomiting caused by the illness.", "C": "The nausea in response to the smell is the conditioned response, not the smell itself.", "E": "Negative reinforcement is an operant concept and does not apply here."}, "explanation": "This is classical conditioning (taste aversion). The food poisoning is the unconditioned stimulus and the vomiting is the unconditioned response. The vinegar, originally neutral, becomes a conditioned stimulus after being paired with the illness, and the nausea it now provokes is the conditioned response.", "objective": "Conditioned stimulus: a neutral stimulus that, after pairing with an unconditioned stimulus, triggers the conditioned response.", "error_hint": "Students label the nausea as the stimulus. Identify what is paired (stimulus) and what is elicited (response).", "explanation_short": ""}, {"stem": "A 27-year-old man is afraid of flying and wishes to take a trip. His therapist teaches him relaxation, and together they make a list of flight-related situations ranked from least to most frightening. Over several sessions he imagines each situation, starting with the least frightening, while remaining relaxed. Which of the following techniques is being used?", "options": ["Aversive conditioning", "Systematic desensitization", "Flooding", "Biofeedback", "Token economy"], "answer": 1, "wrong": {"A": "Aversive conditioning pairs an unwanted behavior with an unpleasant stimulus (for example, disulfiram with alcohol).", "C": "Flooding is immediate, intense exposure to the most feared stimulus without a gradual hierarchy.", "D": "Biofeedback teaches voluntary control of physiologic responses using monitoring devices.", "E": "A token economy uses tokens as secondary reinforcers for desired behavior, usually in institutions."}, "explanation": "Systematic desensitization is a behavioral therapy based on counterconditioning: the patient learns relaxation and is gradually exposed to a hierarchy of feared stimuli, pairing each with relaxation so that the anxiety response is replaced. It is used for phobias.", "objective": "Systematic desensitization uses a graded hierarchy plus relaxation (counterconditioning) to treat phobias.", "error_hint": "Students choose flooding because both involve exposure. The graded hierarchy with relaxation is the key.", "explanation_short": ""}, {"stem": "A 35-year-old woman moves into an apartment near a railway line. For the first 2 weeks she is awakened by the trains and cannot fall asleep. After a month, she no longer notices them. Which of the following best describes this change?", "options": ["Negative reinforcement", "Sensitization", "Classical conditioning", "Extinction", "Habituation"], "answer": 4, "wrong": {"A": "Negative reinforcement is an operant process involving a consequence for a behavior.", "B": "Sensitization is an increased response to stimuli after a strong stimulus, not a decreasing response.", "C": "Classical conditioning requires pairing a neutral stimulus with an unconditioned stimulus.", "D": "Extinction is the loss of a conditioned response when the conditioned stimulus is presented without the unconditioned stimulus (or reinforcement is withdrawn). No conditioning is described."}, "explanation": "Habituation is a decreased response to a repeated, harmless stimulus. It is a form of nonassociative learning and requires no pairing of stimuli or consequences. Sensitization is the opposite: an increased response after a strong or noxious stimulus.", "objective": "Habituation is a decrease in response to a repeated, harmless stimulus (nonassociative learning).", "error_hint": "Students pick extinction because the response goes away. Extinction needs a previously learned association.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
