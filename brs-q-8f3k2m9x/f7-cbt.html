<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Psychotherapy and CBT — practice questions</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--dim:#5b6475;--bd:#d9dde8;--ac:#4f46e5;--ok:#15803d;--okb:#e7f6ec;--bad:#b91c1c;--badb:#fdecec;--hint:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--dim:#9aa3b8;--bd:#2c3140;--ac:#818cf8;--ok:#4ade80;--okb:#12301e;--bad:#f87171;--badb:#341818;--hint:#2f2a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:700}
.lock{font-size:.78em;color:var(--dim)}
h1{font-size:1.45em;margin:.2em 0 .1em}
.sub{color:var(--dim);font-size:.9em;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.qn{font-weight:700;color:var(--ac);font-size:.85em;margin-bottom:4px}
.stem{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-top:5px}.opt .l{font-weight:700;min-width:1.2em}
.q.done .opt{cursor:default}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin:4px 0 0 0;font-size:.88em;color:var(--dim)}
.opt.right .why,.opt.wrong .why{color:var(--tx)}
.res{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.q.done .res{display:block}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.92em}
.obj{background:var(--okb)}.err{background:var(--hint)}
.lbl{font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);display:block}
.flags{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:.9em}
.flags h2{font-size:1em;margin:0 0 6px}.flags li{margin:4px 0}
.fin{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:14px;margin:14px 0;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 7</span><span class="lock">Gap-topic practice</span></div>
<h1>Psychotherapy and CBT</h1><div class="sub">Final topics without a video · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A 34-year-old woman with depression says, \"I failed one report, so I am a complete failure and will never succeed at anything.\" She wants a time-limited, structured therapy in which she and the therapist identify and test these automatic negative thoughts and practice new behaviors between sessions. Which of the following therapies is being described?", "options": ["Cognitive behavioral therapy", "Interpersonal therapy", "Aversive conditioning", "Supportive psychotherapy", "Classic psychoanalysis"], "answer": 0, "wrong": {"B": "Interpersonal therapy focuses on relationships, such as grief, role transitions, and disputes.", "C": "Aversive conditioning pairs a behavior with an unpleasant stimulus.", "D": "Supportive therapy offers reassurance and encouragement without restructuring thoughts.", "E": "Psychoanalysis explores unconscious conflicts through free association and transference over a long period."}, "explanation": "Cognitive behavioral therapy (CBT) is a structured, short-term, present-focused therapy that identifies and restructures cognitive distortions (such as overgeneralization and all-or-nothing thinking) and uses behavioral techniques and homework. It is effective for depression, anxiety disorders, OCD, and bulimia.", "objective": "CBT identifies and challenges cognitive distortions using structured, time-limited sessions with homework.", "error_hint": "Students pick interpersonal therapy because both are short-term. The focus on automatic thoughts is the cue for CBT.", "explanation_short": ""}, {"stem": "A 25-year-old man washes his hands up to 50 times a day because he fears contamination. He recognizes that this is excessive and is distressed by it. He asks about psychotherapy. Which of the following is the most appropriate first-line psychotherapy?", "options": ["Systematic desensitization with relaxation only", "Exposure and response prevention", "Free association", "Group psychotherapy for support", "Hypnosis"], "answer": 1, "wrong": {"A": "Relaxation-based desensitization is not as effective as ERP, which requires blocking the compulsion.", "C": "Free association is part of psychoanalysis and is not effective for OCD.", "D": "Group support is helpful but is not the treatment of choice for OCD.", "E": "Hypnosis lacks evidence in OCD."}, "explanation": "Exposure and response prevention (ERP), a form of CBT, is the first-line psychotherapy for OCD. The patient is exposed to the feared stimulus (contamination) and prevented from performing the compulsion, so the anxiety fades without the ritual. SSRIs are the first-line medication, and the two can be combined.", "objective": "Exposure and response prevention is the first-line psychotherapy for OCD.", "error_hint": "Students choose a relaxation-based approach because OCD is an anxiety-related disorder. ERP specifically blocks the ritual.", "explanation_short": ""}, {"stem": "A psychiatrist is considering psychoanalytically oriented therapy. Which of the following patients is the best candidate?", "options": ["A 30-year-old man who is acutely psychotic", "A 45-year-old man with active cocaine dependence", "A 20-year-old with poor impulse control and recurrent suicide attempts", "A 35-year-old woman with moderate, long-standing anxiety, good relationships and job function, high motivation, and the ability to reflect on her feelings", "A 70-year-old with moderate dementia"], "answer": 3, "wrong": {"A": "Active psychosis is a contraindication because patients lack reality testing.", "B": "Active substance dependence interferes with insight-oriented work.", "C": "Severe impulsivity and recurrent self-harm are better handled with structured approaches such as DBT.", "E": "Cognitive impairment prevents insight-oriented therapy."}, "explanation": "Psychoanalytic and psychodynamic therapy explores unconscious conflicts and early relationships through free association and the interpretation of transference. The best candidates are verbal, motivated, psychologically minded patients with good ego strength, who have stable relationships and the ability to tolerate frustration. Psychosis, severe impulsivity, active addiction, and cognitive impairment are poor prognostic factors.", "objective": "Psychoanalysis suits motivated, insightful patients with good ego strength.", "error_hint": "Students choose the sickest patient. Insight-oriented therapy needs intact reality testing and impulse control.", "explanation_short": ""}, {"stem": "A 45-year-old man says, \"I know I should stop smoking, and I might quit within the next 6 months, but I'm not sure I'm ready.\" Which stage of change is he in, and which approach is best?", "options": ["Maintenance; reinforce his success", "Preparation; give him a quit date and a prescription", "Contemplation; explore his ambivalence with motivational interviewing", "Precontemplation; confront him about the dangers", "Action; offer relapse prevention counseling"], "answer": 2, "wrong": {"A": "Maintenance means the change has been sustained for months.", "B": "Preparation is planning to act in the near future (about 1 month).", "D": "He acknowledges the problem and is considering change, so he is not in precontemplation, and confrontation increases resistance.", "E": "Action means he is already making changes."}, "explanation": "In the transtheoretical model, a patient in contemplation recognizes the problem and is considering change within about 6 months but is ambivalent. Motivational interviewing (empathic, nonconfrontational exploration of ambivalence and reasons for change) is the best approach. Precontemplation: not considering change. Preparation: planning to act within about 30 days. Action: actively changing. Maintenance: sustaining change for 6 months or more.", "objective": "Contemplation: considering change within 6 months; use motivational interviewing.", "error_hint": "Students rush to action. Match the intervention to the stage.", "explanation_short": ""}, {"stem": "A 38-year-old woman with recurrent tension headaches is connected to a device that displays her forehead muscle tension on a screen. With practice she learns to lower the displayed tension and notes that her headaches improve. Which of the following techniques is being used?", "options": ["Aversive conditioning", "Token economy", "Free association", "Flooding", "Biofeedback"], "answer": 4, "wrong": {"A": "Aversive conditioning pairs a behavior with an unpleasant stimulus.", "B": "A token economy rewards desired behaviors with tokens.", "C": "Free association is a psychoanalytic technique.", "D": "Flooding is intense exposure to a feared stimulus."}, "explanation": "Biofeedback uses monitoring equipment to give the patient real-time information about a physiologic process (muscle tension, skin temperature, heart rate) so that the patient learns to control it voluntarily. It is used for tension headaches, migraines, hypertension, and incontinence, and is based on operant conditioning.", "objective": "Biofeedback teaches voluntary control of physiologic responses using real-time monitoring.", "error_hint": "Students choose relaxation techniques generally. The monitoring device is the clue.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
