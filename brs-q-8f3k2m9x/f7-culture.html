<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Family, culture, and illness behavior — practice questions</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--dim:#5b6475;--bd:#d9dde8;--ac:#4f46e5;--ok:#15803d;--okb:#e7f6ec;--bad:#b91c1c;--badb:#fdecec;--hint:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--dim:#9aa3b8;--bd:#2c3140;--ac:#818cf8;--ok:#4ade80;--okb:#12301e;--bad:#f87171;--badb:#341818;--hint:#2f2a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:700}
.lock{font-size:.78em;color:var(--dim)}
h1{font-size:1.45em;margin:.2em 0 .1em}
.sub{color:var(--dim);font-size:.9em;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.qn{font-weight:700;color:var(--ac);font-size:.85em;margin-bottom:4px}
.stem{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-top:5px}.opt .l{font-weight:700;min-width:1.2em}
.q.done .opt{cursor:default}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin:4px 0 0 0;font-size:.88em;color:var(--dim)}
.opt.right .why,.opt.wrong .why{color:var(--tx)}
.res{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.q.done .res{display:block}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.92em}
.obj{background:var(--okb)}.err{background:var(--hint)}
.lbl{font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);display:block}
.flags{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:.9em}
.flags h2{font-size:1em;margin:0 0 6px}.flags li{margin:4px 0}
.fin{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:14px;margin:14px 0;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 7</span><span class="lock">Gap-topic practice</span></div>
<h1>Family, culture, and illness behavior</h1><div class="sub">Final topics without a video · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A 45-year-old man with influenza is excused from work, stays in bed for several days, and is not blamed by his family for being ill. He also follows his physician's advice and takes the prescribed medication. Which of the following concepts best describes this pattern?", "options": ["Malingering", "Conversion disorder", "Somatic symptom disorder", "Factitious disorder", "Sick role"], "answer": 4, "wrong": {"A": "Malingering is conscious fabrication for external gain.", "B": "Conversion disorder involves neurologic symptoms without a medical cause.", "C": "Somatic symptom disorder involves excessive distress about physical symptoms.", "D": "Factitious disorder is conscious fabrication for the sick role without external gain."}, "explanation": "In Parsons' sick role, the ill person is exempt from normal responsibilities and not blamed for the illness, but is obligated to try to get well and to seek and follow competent medical help. The sick role applies to legitimate illness.", "objective": "Sick role: exempt from duties and not blamed, but obligated to seek care and get well.", "error_hint": "Students pick the diagnosis labels. Here the illness is real and the behavior is expected.", "explanation_short": ""}, {"stem": "A physician sees a 62-year-old woman who speaks only Spanish. Her 14-year-old grandson offers to translate. Which of the following is the most appropriate approach?", "options": ["Use a trained professional medical interpreter", "Postpone the visit until she learns English", "Use gestures and simple English", "Allow the grandson to interpret to preserve confidentiality", "Ask the patient to bring an adult relative next time"], "answer": 0, "wrong": {"B": "Delaying care is inappropriate.", "C": "Gestures risk miscommunication.", "D": "Children should not interpret, particularly for sensitive information.", "E": "Relatives are not recommended, and the care should not be delayed."}, "explanation": "A trained medical interpreter should be used for patients with limited English proficiency. Family members, and especially minors, may omit or alter information, affect confidentiality and the patient's willingness to disclose, and are not trained in medical terminology. Interpretation is required for informed consent.", "objective": "Use trained professional interpreters rather than family members, especially children.", "error_hint": "Students prefer convenience. The correct choice is a trained interpreter.", "explanation_short": ""}, {"stem": "A 38-year-old man who recently immigrated reports headaches that he believes are caused by an angry ancestral spirit. His physical examination is normal. Which of the following is the most appropriate approach by the physician?", "options": ["Prescribe an antipsychotic", "Dismiss the beliefs and prescribe an analgesic", "Refer him immediately to a psychiatrist for delusional disorder", "Ask what he thinks caused the illness and how it should be treated, then negotiate a plan that respects his beliefs and includes medical care", "Tell him that spirits are not a medical explanation"], "answer": 3, "wrong": {"A": "There are no signs of psychosis.", "B": "Ignoring the beliefs leads to poor engagement.", "C": "Culturally shared beliefs are not delusions.", "E": "Dismissing the belief damages trust and adherence."}, "explanation": "Culturally competent care elicits the patient's explanatory model (what he thinks caused the problem, what he fears, and how he expects it to be treated) and works with it. Beliefs that are shared by a person's cultural group are not delusions. The physician can combine respect for beliefs with evidence-based treatment.", "objective": "Elicit the patient's explanatory model and negotiate a culturally respectful plan.", "error_hint": "Students pathologize unfamiliar beliefs. A belief shared by the patient's culture is not a delusion.", "explanation_short": ""}, {"stem": "A 5-year-old boy from a Vietnamese family is brought to the clinic with a cough and fever. Examination shows parallel linear red marks on his back. His parents explain that they rubbed his back with a coin because it is a traditional treatment for illness (cao gio). There are no other injuries, the history is consistent, and the child is otherwise well cared for. Which of the following is the most appropriate action?", "options": ["Report the family to child protective services immediately", "Accuse the parents of abuse", "Ask about the practice respectfully, examine the child for other injuries, and treat his respiratory illness without presuming abuse", "Forbid the family from using any traditional remedies", "Admit the child for protection"], "answer": 2, "wrong": {"A": "Reporting without assessing the context is premature.", "B": "Accusation damages trust.", "D": "Forbidding practices without understanding them reduces cooperation.", "E": "There is no indication for admission for protection."}, "explanation": "Coining (cao gio) and cupping are folk practices that cause characteristic bruising. A culturally sensitive physician asks about the practice, makes sure the findings, history, and pattern are consistent, and examines for other signs of injury or neglect. A consistent history with no other findings does not call for a report, but any evidence of inconsistency or harm still warrants evaluation. The physician should treat the medical illness and counsel about any risks.", "objective": "Recognize folk practices such as coining and cupping; assess consistency and rule out other injuries before concluding abuse.", "error_hint": "Students apply a rule automatically. Cultural practice requires careful, sensitive assessment, not an automatic report.", "explanation_short": ""}, {"stem": "A 58-year-old man with hypertension has stopped taking his medications. He takes a pill twice daily and has had frequent dizziness. He says that he forgets the evening dose. Which of the following is most likely to improve his adherence?", "options": ["A warning that he will have a stroke", "Simplifying the regimen, for example with once-daily dosing, and addressing his side effects while maintaining a supportive relationship", "Stopping all follow-up visits", "Telling him that he is irresponsible", "Adding several more medications"], "answer": 1, "wrong": {"A": "Fear-based messages do not improve adherence long term.", "C": "Less follow-up reduces support.", "D": "Blame damages the relationship.", "E": "More medications make the regimen more complex."}, "explanation": "Adherence improves with a strong physician-patient relationship, patient education, a simple regimen (fewer doses, fewer drugs, once-daily dosing), minimal side effects, and addressing patient concerns and costs. Scare tactics and blame are ineffective. Poor adherence is more likely with complex regimens, side effects, asymptomatic conditions, and poor rapport.", "objective": "Adherence improves with simpler regimens, fewer side effects, and a good physician-patient relationship.", "error_hint": "Students choose threats or education alone. Simplification and rapport are the strongest levers.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
