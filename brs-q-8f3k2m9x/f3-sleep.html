<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sleep disorders: diagnosis and management — practice questions</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--dim:#5b6475;--bd:#d9dde8;--ac:#4f46e5;--ok:#15803d;--okb:#e7f6ec;--bad:#b91c1c;--badb:#fdecec;--hint:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--dim:#9aa3b8;--bd:#2c3140;--ac:#818cf8;--ok:#4ade80;--okb:#12301e;--bad:#f87171;--badb:#341818;--hint:#2f2a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:700}
.lock{font-size:.78em;color:var(--dim)}
h1{font-size:1.45em;margin:.2em 0 .1em}
.sub{color:var(--dim);font-size:.9em;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.qn{font-weight:700;color:var(--ac);font-size:.85em;margin-bottom:4px}
.stem{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-top:5px}.opt .l{font-weight:700;min-width:1.2em}
.q.done .opt{cursor:default}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin:4px 0 0 0;font-size:.88em;color:var(--dim)}
.opt.right .why,.opt.wrong .why{color:var(--tx)}
.res{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.q.done .res{display:block}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.92em}
.obj{background:var(--okb)}.err{background:var(--hint)}
.lbl{font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);display:block}
.flags{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:.9em}
.flags h2{font-size:1em;margin:0 0 6px}.flags li{margin:4px 0}
.fin{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:14px;margin:14px 0;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 3</span><span class="lock">Gap-topic practice</span></div>
<h1>Sleep disorders: diagnosis and management</h1><div class="sub">Sleep · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A 19-year-old college student falls asleep during lectures despite sleeping 9 hours each night. She reports that when she laughs hard her knees buckle and she once fell to the floor while fully awake and aware. She occasionally sees vivid images as she falls asleep and has woken unable to move for a minute. Which of the following is the most likely underlying pathology?", "options": ["Degeneration of the substantia nigra pars compacta", "Excess serotonin in the dorsal raphe nuclei", "Loss of hypocretin (orexin)-producing neurons in the lateral hypothalamus", "Loss of cholinergic neurons in the nucleus basalis of Meynert", "Damage to the suprachiasmatic nucleus"], "answer": 2, "wrong": {"A": "Substantia nigra degeneration causes Parkinson disease.", "B": "Serotonin from the raphe nuclei is involved in sleep regulation, but narcolepsy is not caused by excess serotonin.", "D": "Loss of nucleus basalis cholinergic neurons is seen in Alzheimer disease.", "E": "The suprachiasmatic nucleus controls circadian rhythm. Damage causes a circadian disorder, not cataplexy."}, "explanation": "Narcolepsy with cataplexy is the tetrad of excessive daytime sleepiness, cataplexy (sudden loss of muscle tone triggered by emotion), hypnagogic hallucinations, and sleep paralysis. Type 1 narcolepsy is caused by loss of hypocretin (orexin) neurons in the lateral hypothalamus, with low CSF hypocretin. Polysomnography typically shows REM sleep within 15 minutes of sleep onset.", "objective": "Type 1 narcolepsy results from loss of hypocretin (orexin) neurons in the lateral hypothalamus.", "error_hint": "Students think of any REM-related nucleus. Cataplexy and low CSF hypocretin point to the lateral hypothalamus.", "explanation_short": ""}, {"stem": "A 24-year-old man with narcolepsy with cataplexy has a major complaint of falling asleep at work, despite good sleep hygiene and scheduled naps. He has no history of substance use. Which of the following is the most appropriate first-line medication for his daytime sleepiness?", "options": ["Modafinil", "Lorazepam", "Propranolol", "Zolpidem", "Melatonin"], "answer": 0, "wrong": {"B": "Benzodiazepines are sedating and would worsen sleepiness.", "C": "Propranolol has no role in narcolepsy.", "D": "Zolpidem is a hypnotic that promotes sleep, which would worsen his problem.", "E": "Melatonin helps circadian phase disorders and does not treat narcolepsy."}, "explanation": "Modafinil (or armodafinil) is a wake-promoting agent and first-line treatment for excessive sleepiness in narcolepsy. Sodium oxybate treats both cataplexy and sleepiness, and cataplexy can also be treated with SSRIs, venlafaxine, or tricyclics, which suppress REM sleep.", "objective": "Modafinil is first-line for daytime sleepiness in narcolepsy.", "error_hint": "Students choose a sedative because the problem is a sleep disorder. His problem is too much sleep during the day, so a wake-promoting drug is needed.", "explanation_short": ""}, {"stem": "A 52-year-old man with a BMI of 38 kg/m2 and hypertension comes to the clinic with morning headaches and daytime sleepiness. His wife says he snores loudly and stops breathing for 10 to 20 seconds repeatedly during the night. Overnight polysomnography shows an apnea-hypopnea index of 32 events per hour. Which of the following is the most appropriate treatment?", "options": ["Modafinil alone", "Continuous positive airway pressure", "Nocturnal oxygen alone", "Zolpidem at bedtime", "Uvulopalatopharyngoplasty"], "answer": 1, "wrong": {"A": "Modafinil can help residual sleepiness in patients who are adherent to CPAP, but it does not treat the apnea.", "C": "Oxygen alone does not prevent the obstruction and may prolong apneas.", "D": "Hypnotics and other sedatives worsen obstructive sleep apnea by relaxing airway muscles and blunting arousal.", "E": "Surgery is second-line for patients who cannot tolerate CPAP and is less reliably effective."}, "explanation": "Obstructive sleep apnea is repeated collapse of the upper airway during sleep, causing fragmented sleep, daytime sleepiness, and morning headaches. It is diagnosed with polysomnography. CPAP is first-line for moderate to severe disease, together with weight loss, and it reduces blood pressure and cardiovascular risk.", "objective": "CPAP is first-line treatment for moderate to severe obstructive sleep apnea; avoid sedatives.", "error_hint": "Students treat the sleepiness instead of the apnea.", "explanation_short": ""}, {"stem": "A 68-year-old man is brought by his wife because for the past year he has been shouting, punching, and kicking in his sleep. Last week he struck his wife while dreaming that he was fighting an attacker. When awakened, he describes a vivid dream and is fully alert. Polysomnography shows REM sleep without the normal muscle atonia. This patient is at highest risk for developing which of the following?", "options": ["Creutzfeldt-Jakob disease", "Multiple sclerosis", "Huntington disease", "Parkinson disease or dementia with Lewy bodies", "Alzheimer disease"], "answer": 3, "wrong": {"A": "Creutzfeldt-Jakob disease causes rapidly progressive dementia and myoclonus.", "B": "Multiple sclerosis causes demyelination and is not linked to REM sleep behavior disorder.", "C": "Huntington disease is a trinucleotide repeat disorder and is not associated with REM sleep behavior disorder.", "E": "Alzheimer disease is not strongly associated with REM sleep behavior disorder."}, "explanation": "REM sleep behavior disorder (loss of normal REM atonia causing patients to act out dreams) is often an early manifestation of alpha-synucleinopathies such as Parkinson disease, dementia with Lewy bodies, and multiple system atrophy, sometimes preceding them by years. Treatment includes bedroom safety measures and clonazepam or melatonin.", "objective": "REM sleep behavior disorder is a prodrome of alpha-synucleinopathies (Parkinson disease, Lewy body dementia).", "error_hint": "Students choose Alzheimer disease because it is the most common dementia. The pairing of dream enactment with synuclein disease is the tested link.", "explanation_short": ""}, {"stem": "A 6-year-old boy screams loudly about 1 hour after falling asleep. His parents find him sitting up with his eyes open, sweating, with a rapid heart rate. He cannot be comforted and does not recognize them. After a few minutes he lies back down. In the morning he has no memory of the event. During which stage of sleep did this episode most likely arise?", "options": ["REM sleep", "Stage N1", "Wakefulness", "Stage N2", "Stage N3 (slow-wave sleep)"], "answer": 4, "wrong": {"A": "Nightmares arise from REM sleep, occur later in the night, are remembered, and the child is easily awakened and comforted.", "B": "N1 is a light transitional stage and does not produce parasomnias.", "C": "He is not fully awake, which is why he does not recognize his parents and has amnesia.", "D": "N2 sleep is not the origin of night terrors."}, "explanation": "Night terrors (sleep terrors) and sleepwalking are non-REM parasomnias that arise from stage N3 slow-wave sleep, which is concentrated in the first third of the night. The child is not fully awake, is inconsolable, and has amnesia for the event. Treatment is reassurance; they usually resolve in childhood.", "objective": "Night terrors and sleepwalking arise from N3 slow-wave sleep; nightmares arise from REM sleep.", "error_hint": "Students confuse night terrors with nightmares. Amnesia, early-night timing, and inconsolability point to N3.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
