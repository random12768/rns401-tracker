*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}

</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 2</span><span class="lock">Gap-topic practice</span></div>
<h1>Eating disorders: anorexia, bulimia, and binge eating</h1><div class="sub">Substance Use & Eating Disorders · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A 17-year-old girl is brought by her mother because she has not had a menstrual period for 5 months. She runs 10 miles daily, eats very little, and says she is afraid of getting fat, even though her friends say she looks too thin. Her BMI is 16.5 kg/m2, pulse is 44/min, and blood pressure is 85/50 mm Hg. She has fine hair over her back. Which of the following hormonal findings is most likely?", "options": ["Increased TSH", "Decreased cortisol", "Decreased estradiol, LH, and FSH", "Increased LH and FSH", "Increased serum leptin"], "answer": 2, "wrong": {"A": "TSH is usually normal or low-normal, with a low T3.", "B": "Cortisol is typically increased in anorexia nervosa.", "D": "High LH and FSH would indicate primary ovarian insufficiency, not hypothalamic suppression.", "E": "Leptin is made by fat cells and is low in low-weight patients, which contributes to the hypothalamic suppression."}, "explanation": "This is anorexia nervosa. Low body weight suppresses the hypothalamic GnRH pulse generator, so LH, FSH, and estradiol are low, producing amenorrhea. Cortisol is increased, T3 is low (a low T3 'euthyroid sick' pattern), and leptin is low.", "objective": "Anorexia nervosa causes hypothalamic suppression: low LH, FSH, and estradiol, with high cortisol and low leptin.", "error_hint": "Students pick high gonadotropins as in ovarian failure. In anorexia the problem is central, so gonadotropins are low.", "explanation_short": ""}, {"stem": "A 22-year-old woman with a normal BMI comes to the clinic because of fatigue. She admits to eating large amounts of food in a short time three times a week, feeling out of control, then making herself vomit. Examination shows enlarged parotid glands, dental enamel erosion, and calluses on the dorsum of her hand. Which of the following laboratory abnormalities is most likely?", "options": ["Hypernatremia", "Hypochloremic hypokalemic metabolic alkalosis", "Hyperkalemia", "Hyperchloremic metabolic acidosis", "Respiratory alkalosis"], "answer": 1, "wrong": {"A": "Volume loss can raise sodium, but the typical electrolyte pattern from vomiting is hypochloremic hypokalemic alkalosis.", "C": "Potassium is lost with vomiting, so hypokalemia is expected.", "D": "A non-anion-gap acidosis is more typical of laxative abuse because of bicarbonate loss in stool. Vomiting causes alkalosis.", "E": "Respiratory alkalosis results from hyperventilation, which is not described."}, "explanation": "This is bulimia nervosa, purging type. Repeated vomiting loses gastric acid (HCl), causing hypochloremic metabolic alkalosis, and volume depletion with aldosterone activation causes potassium loss. The calluses on the knuckles are Russell sign, and parotid enlargement and enamel erosion are common.", "objective": "Vomiting causes hypochloremic hypokalemic metabolic alkalosis; laxative abuse tends to cause non-anion-gap acidosis.", "error_hint": "Students pick acidosis because eating disorders sound like starvation. The type of purge decides the acid-base picture.", "explanation_short": ""}, {"stem": "A 24-year-old woman with bulimia nervosa asks about treatment. She is not currently suicidal and has no history of seizures. Which of the following is the most appropriate pharmacotherapy to combine with cognitive behavioral therapy?", "options": ["Fluoxetine", "Lisdexamfetamine", "Lithium", "Olanzapine", "Bupropion"], "answer": 0, "wrong": {"B": "Lisdexamfetamine is approved for binge-eating disorder, not bulimia nervosa, and it suppresses appetite.", "C": "Lithium has no role in bulimia and is dangerous in dehydrated, electrolyte-depleted patients.", "D": "Olanzapine has limited evidence in anorexia nervosa (for weight gain), not bulimia.", "E": "Bupropion lowers the seizure threshold and is contraindicated in bulimia nervosa and anorexia nervosa."}, "explanation": "CBT is first-line for bulimia nervosa, and SSRIs, particularly fluoxetine (at higher doses), reduce binge-purge frequency. Bupropion is contraindicated in bulimia nervosa because of an increased risk of seizures, especially with electrolyte disturbances from purging.", "objective": "Fluoxetine plus CBT is the treatment for bulimia; bupropion is contraindicated.", "error_hint": "Students choose bupropion because it is an antidepressant that does not cause weight gain. Its seizure risk rules it out here.", "explanation_short": ""}, {"stem": "A 19-year-old woman with anorexia nervosa is admitted with a BMI of 14 kg/m2 and begins nutritional rehabilitation. On hospital day 3 she develops weakness, confusion, and a ventricular arrhythmia. Which of the following laboratory abnormalities is most likely responsible?", "options": ["Hypercalcemia", "Hyperphosphatemia", "Hyperkalemia", "Hypernatremia", "Hypophosphatemia"], "answer": 4, "wrong": {"A": "Calcium is not typically increased in refeeding.", "B": "Phosphate falls rather than rises.", "C": "Potassium is low, not high, because insulin drives it into cells.", "D": "Sodium retention can occur, but it is not the main cause of the arrhythmia."}, "explanation": "Refeeding syndrome occurs when carbohydrate feeding raises insulin and drives phosphate, potassium, and magnesium into cells in a patient who is depleted. Hypophosphatemia is the hallmark and can cause muscle weakness, cardiac arrhythmias, respiratory failure, and delirium. Thiamine is also given.", "objective": "Refeeding syndrome produces hypophosphatemia with hypokalemia and hypomagnesemia.", "error_hint": "Students think of electrolyte excess because the patient is being given nutrition. The shift into cells causes deficiency.", "explanation_short": ""}, {"stem": "A 38-year-old man with a BMI of 34 kg/m2 says that about three times a week he eats an unusually large amount of food within 2 hours, eating much faster than normal and until he is uncomfortably full, even when not hungry. He feels out of control during these episodes and feels disgusted and guilty afterward. He does not vomit, take laxatives, or exercise excessively. This has occurred for 6 months. Which of the following is the most likely diagnosis?", "options": ["Anorexia nervosa, binge-purge type", "Bulimia nervosa", "Major depressive disorder with atypical features", "Binge-eating disorder", "Night eating syndrome"], "answer": 3, "wrong": {"A": "Anorexia nervosa requires significantly low body weight.", "B": "Bulimia requires regular compensatory behavior, which is absent.", "C": "Atypical depression can cause overeating, but this vignette has no mood symptoms.", "E": "Night eating syndrome is a pattern of eating mostly after the evening meal or after waking at night. The binges here are not tied to night."}, "explanation": "Binge-eating disorder consists of recurrent binge episodes with loss of control and marked distress, without the regular compensatory behaviors (vomiting, laxatives, fasting, or excessive exercise) seen in bulimia nervosa. It is the most common eating disorder and is often associated with obesity. Lisdexamfetamine is approved for it, and CBT is first-line.", "objective": "Binge-eating disorder is binge episodes with no regular compensatory behavior.", "error_hint": "Students call it bulimia because of the binges. The absence of purging or other compensation separates the two.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
