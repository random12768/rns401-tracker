<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Child abuse: recognition and reporting — practice questions</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--dim:#5b6475;--bd:#d9dde8;--ac:#4f46e5;--ok:#15803d;--okb:#e7f6ec;--bad:#b91c1c;--badb:#fdecec;--hint:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--dim:#9aa3b8;--bd:#2c3140;--ac:#818cf8;--ok:#4ade80;--okb:#12301e;--bad:#f87171;--badb:#341818;--hint:#2f2a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:700}
.lock{font-size:.78em;color:var(--dim)}
h1{font-size:1.45em;margin:.2em 0 .1em}
.sub{color:var(--dim);font-size:.9em;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.qn{font-weight:700;color:var(--ac);font-size:.85em;margin-bottom:4px}
.stem{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-top:5px}.opt .l{font-weight:700;min-width:1.2em}
.q.done .opt{cursor:default}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin:4px 0 0 0;font-size:.88em;color:var(--dim)}
.opt.right .why,.opt.wrong .why{color:var(--tx)}
.res{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.q.done .res{display:block}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.92em}
.obj{background:var(--okb)}.err{background:var(--hint)}
.lbl{font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);display:block}
.flags{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:.9em}
.flags h2{font-size:1em;margin:0 0 6px}.flags li{margin:4px 0}
.fin{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:14px;margin:14px 0;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 5</span><span class="lock">Gap-topic practice</span></div>
<h1>Child abuse: recognition and reporting</h1><div class="sub">Abuse & Neglect · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A 7-month-old boy is brought to the emergency department with a swollen thigh. Radiographs show a femoral fracture. His father says the child rolled off the couch. Examination shows retinal hemorrhages. CT shows a subdural hematoma. There are no external bruises. Which of the following is the most appropriate next step?", "options": ["Ask the father's permission to contact child protective services", "Refer the family for outpatient family therapy", "Wait for a confession before filing any report", "Report the case to child protective services and admit the child", "Reassure the parents and arrange outpatient follow-up"], "answer": 3, "wrong": {"A": "Parental permission is not required, and asking for it can compromise the child's safety.", "B": "Therapy does not address the immediate danger.", "C": "A confession is not required. Reasonable suspicion triggers the duty to report.", "E": "Sending the child home risks further injury."}, "explanation": "The findings (a femur fracture in a non-ambulatory infant, retinal hemorrhages, and subdural hematoma) are consistent with abusive head trauma and physical abuse and are inconsistent with the explanation given. Physicians are mandated reporters; reasonable suspicion is enough. The child should be admitted for safety, and a report must be filed with child protective services.", "objective": "Report suspected child abuse to child protective services; reasonable suspicion is sufficient and parental consent is unnecessary.", "error_hint": "Students want to confirm abuse before reporting. The duty is triggered by suspicion.", "explanation_short": ""}, {"stem": "A 2-year-old girl is brought to the clinic for a well-child visit. Which of the following findings on examination is most suggestive of physical abuse?", "options": ["Bilateral bruises over the shins", "Round, 8-mm punched-out burns of different ages on the back", "Blue-gray discoloration over the lower back present since birth", "A single small bruise on the forehead after a fall from a low chair", "Nursemaid's elbow after the child was lifted by the hand"], "answer": 1, "wrong": {"A": "Bruises over the shins are common in toddlers who are walking and climbing.", "C": "These are Mongolian spots (congenital dermal melanocytosis), benign and sometimes mistaken for bruises.", "D": "A single forehead bruise after a plausible fall fits the history.", "E": "Nursemaid's elbow (radial head subluxation) is common after longitudinal traction and is usually accidental."}, "explanation": "Round, punched-out burns about 8 mm across are typical of cigarette burns, and lesions in different stages of healing on a covered area such as the back suggest repeated inflicted injury. Other red flags include bruises on the ears, neck, torso, or buttocks of young children, bruises in non-mobile infants, and injuries inconsistent with the history.", "objective": "Patterned injuries, injuries of different ages, and injuries inconsistent with the history suggest abuse.", "error_hint": "Students flag bruising of any kind. The pattern and location matter.", "explanation_short": ""}, {"stem": "A pediatrician suspects that a 5-year-old patient's multiple bruises are from abuse. The child's mother is cooperative and begs the physician not to report the family because \"it would ruin our lives.\" Which of the following statements best describes the physician's responsibility?", "options": ["Reporting is required only if the parents confess", "Reporting requires the parents' written consent", "Reporting is required when abuse is reasonably suspected, and physicians acting in good faith are generally protected from liability", "Reporting requires confirmation of abuse by a child protection expert", "Reporting is optional if the parents seem cooperative"], "answer": 2, "wrong": {"A": "A confession is not required.", "B": "Parental consent is not needed.", "D": "Confirmation is not required; investigating is the role of child protective services.", "E": "Reporting is mandatory regardless of how cooperative the parents are."}, "explanation": "Physicians are mandated reporters of suspected child abuse and neglect. The standard is reasonable suspicion, not proof. This duty overrides confidentiality, and good-faith reporters are protected from liability in most jurisdictions. Investigation is the responsibility of child protective services.", "objective": "Mandated reporting is triggered by reasonable suspicion and overrides confidentiality.", "error_hint": "Students think they must prove abuse first. The physician only has to suspect it.", "explanation_short": ""}, {"stem": "A 7-year-old girl is brought by her mother because of genital pain and new sexualized play with her dolls. She says that an adult who visits the family \"touched me where I go to the bathroom.\" The genital examination is normal. Which of the following statements is most accurate?", "options": ["A normal genital examination makes sexual abuse unlikely", "The perpetrator is most likely a stranger", "Reporting should wait until the police have interviewed the child", "Sexualized play is normal at this age and is not a warning sign", "The perpetrator is most likely someone known to the child, and a normal examination does not exclude abuse"], "answer": 4, "wrong": {"A": "Most victims have no abnormal findings, because many forms of abuse leave no physical evidence and tissue heals quickly.", "B": "Abuse by strangers accounts for a minority of cases.", "C": "Mandated reporting is triggered by reasonable suspicion and does not depend on a police interview.", "D": "Developmentally inappropriate sexual knowledge or behavior is a recognized red flag."}, "explanation": "Most child sexual abuse is committed by someone the child knows, including relatives and acquaintances, rather than by strangers. The examination is frequently normal, so the history and the child's disclosure are central. Sexualized play and knowledge beyond the child's age are warning signs. A physician who suspects abuse must report it to child protective services without waiting for other investigations.", "objective": "Most child sexual abuse is by someone known to the child; a normal exam does not exclude it.", "error_hint": "Students expect a stranger and trust a normal exam. Both assumptions are common errors.", "explanation_short": ""}, {"stem": "A 2-year-old boy is brought to the clinic by a neighbor. He is below the 3rd percentile for weight, wears a soiled diaper, has an untreated ear infection and severe diaper rash, and has not received any vaccinations. His parents are often away and leave him alone. Which of the following is the most common form of child maltreatment reported in the United States and is best illustrated by this case?", "options": ["Neglect", "Factitious disorder imposed on another", "Emotional abuse", "Sexual abuse", "Physical abuse"], "answer": 0, "wrong": {"B": "Factitious disorder imposed on another involves a caregiver inducing or fabricating illness in a child for attention.", "C": "Emotional abuse is real but is not the most commonly reported type.", "D": "Sexual abuse is less common than neglect.", "E": "Physical abuse is less common than neglect and presents with injuries."}, "explanation": "Neglect, the failure to provide for a child's basic physical, medical, emotional, or educational needs, is the most common form of child maltreatment. Poor growth, poor hygiene, untreated medical problems, and lack of supervision are typical. It is reportable in the same way as abuse.", "objective": "Neglect is the most common form of child maltreatment; it must be reported.", "error_hint": "Students expect abuse to involve injuries. Neglect usually shows as failure to thrive and untreated problems.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
