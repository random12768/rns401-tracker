<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Defense mechanisms in clinical vignettes — practice questions</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--dim:#5b6475;--bd:#d9dde8;--ac:#4f46e5;--ok:#15803d;--okb:#e7f6ec;--bad:#b91c1c;--badb:#fdecec;--hint:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--dim:#9aa3b8;--bd:#2c3140;--ac:#818cf8;--ok:#4ade80;--okb:#12301e;--bad:#f87171;--badb:#341818;--hint:#2f2a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:700}
.lock{font-size:.78em;color:var(--dim)}
h1{font-size:1.45em;margin:.2em 0 .1em}
.sub{color:var(--dim);font-size:.9em;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.qn{font-weight:700;color:var(--ac);font-size:.85em;margin-bottom:4px}
.stem{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-top:5px}.opt .l{font-weight:700;min-width:1.2em}
.q.done .opt{cursor:default}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin:4px 0 0 0;font-size:.88em;color:var(--dim)}
.opt.right .why,.opt.wrong .why{color:var(--tx)}
.res{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.q.done .res{display:block}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.92em}
.obj{background:var(--okb)}.err{background:var(--hint)}
.lbl{font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);display:block}
.flags{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:.9em}
.flags h2{font-size:1em;margin:0 0 6px}.flags li{margin:4px 0}
.fin{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:14px;margin:14px 0;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 4</span><span class="lock">Gap-topic practice</span></div>
<h1>Defense mechanisms in clinical vignettes</h1><div class="sub">Learning Theories & Defense Mechanisms · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A 40-year-old man is reprimanded by his supervisor at work. He says nothing to his supervisor, but when he gets home he shouts at his wife about the dinner. Which of the following defense mechanisms is the man using?", "options": ["Rationalization", "Sublimation", "Reaction formation", "Projection", "Displacement"], "answer": 4, "wrong": {"A": "Rationalization makes up logical-sounding excuses for behavior.", "B": "Sublimation channels an unacceptable impulse into a socially useful activity.", "C": "Reaction formation transforms an unacceptable impulse into its opposite.", "D": "Projection attributes one's own unacceptable feelings to someone else."}, "explanation": "Displacement shifts an emotion from its real object (the supervisor) onto a safer substitute (the wife). It is considered an immature-to-neurotic defense.", "objective": "Displacement redirects an emotion from its true source to a safer target.", "error_hint": "Students pick projection because the man is angry at someone. Projection places his own feelings onto another person, not his anger onto a substitute.", "explanation_short": ""}, {"stem": "A woman who has intense unconscious resentment toward her mother-in-law repeatedly gives her expensive gifts and speaks of her in glowing terms. Which of the following defense mechanisms is she using?", "options": ["Reaction formation", "Isolation of affect", "Undoing", "Denial", "Splitting"], "answer": 0, "wrong": {"B": "Isolation of affect separates the emotion from the memory or event, leaving a detached, factual account.", "C": "Undoing tries to symbolically reverse something done, for example by apologizing or giving a gift after acting hostile.", "D": "Denial refuses to acknowledge a painful reality.", "E": "Splitting divides people into all good or all bad."}, "explanation": "Reaction formation replaces an unacceptable impulse with its exaggerated opposite. Excessive kindness toward a person one actually resents is the classic example.", "objective": "Reaction formation turns an unacceptable impulse into its opposite.", "error_hint": "Students choose undoing because gifts feel like making amends. Undoing follows a specific hostile act.", "explanation_short": ""}, {"stem": "A 48-year-old man is told he has pancreatic cancer. Over the next weeks he reads every journal article about it, compares surgical techniques, and talks about the disease with the clinical detachment of a researcher, without appearing upset. Which of the following defense mechanisms is he using?", "options": ["Rationalization", "Suppression", "Repression", "Intellectualization", "Regression"], "answer": 3, "wrong": {"A": "Rationalization justifies a disappointing outcome with plausible explanations ('sour grapes').", "B": "Suppression is the conscious decision to postpone attention to a conflict and is a mature defense.", "C": "Repression is an unconscious blocking of a memory or impulse from awareness.", "E": "Regression is a return to behavior typical of an earlier stage of development."}, "explanation": "Intellectualization avoids the emotional impact of a threat by focusing on its abstract or factual aspects. It is a neurotic-level defense often seen in patients facing a serious diagnosis.", "objective": "Intellectualization uses abstract, factual analysis to avoid feeling.", "error_hint": "Students confuse intellectualization with rationalization. Rationalization explains away; intellectualization detaches by analyzing.", "explanation_short": ""}, {"stem": "A medical student has an examination tomorrow and is anxious about a difficult question on her last test. She tells herself, \"I can't change that now. I'll worry about it after the exam,\" and returns to studying. Which of the following defense mechanisms is she using?", "options": ["Denial", "Splitting", "Suppression", "Dissociation", "Repression"], "answer": 2, "wrong": {"A": "Denial is refusing to accept that something is real. She accepts that the question happened.", "B": "Splitting divides people into all good or all bad.", "D": "Dissociation is a disruption in consciousness, memory, or identity.", "E": "Repression is unconscious; she is aware of her decision."}, "explanation": "Suppression is the conscious, voluntary decision to put an unpleasant thought aside for later and is classified as a mature defense. In contrast, repression is unconscious.", "objective": "Suppression is conscious; repression is unconscious.", "error_hint": "Students pick repression because both push thoughts away. The conscious choice makes it suppression.", "explanation_short": ""}, {"stem": "A 32-year-old man is furious at a co-worker who humiliated him. He begins boxing at a local gym and soon wins amateur tournaments. Which of the following defense mechanisms is he using?", "options": ["Undoing", "Sublimation", "Acting out", "Projection", "Displacement"], "answer": 1, "wrong": {"A": "Undoing tries to reverse a previous action symbolically.", "C": "Acting out expresses the impulse directly through behavior, often inappropriately.", "D": "Projection attributes one's own unacceptable feelings to others.", "E": "Displacement transfers the emotion onto a safer target, such as shouting at a family member."}, "explanation": "Sublimation channels an unacceptable impulse (here, aggression) into a socially acceptable and constructive activity. It is a mature defense.", "objective": "Sublimation turns an unacceptable impulse into a constructive activity.", "error_hint": "Students pick displacement because the anger is redirected. In sublimation the new outlet is socially valued.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
