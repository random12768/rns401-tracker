<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Personality disorders: Cluster B and treatment — practice questions</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--dim:#5b6475;--bd:#d9dde8;--ac:#4f46e5;--ok:#15803d;--okb:#e7f6ec;--bad:#b91c1c;--badb:#fdecec;--hint:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--dim:#9aa3b8;--bd:#2c3140;--ac:#818cf8;--ok:#4ade80;--okb:#12301e;--bad:#f87171;--badb:#341818;--hint:#2f2a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:700}
.lock{font-size:.78em;color:var(--dim)}
h1{font-size:1.45em;margin:.2em 0 .1em}
.sub{color:var(--dim);font-size:.9em;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.qn{font-weight:700;color:var(--ac);font-size:.85em;margin-bottom:4px}
.stem{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-top:5px}.opt .l{font-weight:700;min-width:1.2em}
.q.done .opt{cursor:default}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin:4px 0 0 0;font-size:.88em;color:var(--dim)}
.opt.right .why,.opt.wrong .why{color:var(--tx)}
.res{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.q.done .res{display:block}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.92em}
.obj{background:var(--okb)}.err{background:var(--hint)}
.lbl{font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);display:block}
.flags{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:.9em}
.flags h2{font-size:1em;margin:0 0 6px}.flags li{margin:4px 0}
.fin{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:14px;margin:14px 0;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 1</span><span class="lock">Gap-topic practice</span></div>
<h1>Personality disorders: Cluster B and treatment</h1><div class="sub">Personality Disorders · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A 22-year-old woman comes to the emergency department after superficially cutting her forearm following an argument with her boyfriend. She has had many intense, short relationships. She told her new therapist at the first visit that he was the only person who ever understood her, but after he rescheduled one appointment she called him cruel and incompetent. She says she feels empty most of the time and has spent thousands of dollars impulsively. Which of the following is the most appropriate long-term treatment?", "options": ["Classic psychoanalysis four times weekly", "Lorazepam as needed", "Electroconvulsive therapy", "Lithium", "Dialectical behavior therapy"], "answer": 4, "wrong": {"A": "Classic psychoanalysis is poorly tolerated by these patients and has less evidence than DBT.", "B": "Benzodiazepines carry a risk of dependence and disinhibition and are avoided in these patients.", "C": "ECT treats severe depression or catatonia. It is not a treatment for borderline personality disorder.", "D": "Lithium is a mood stabilizer for bipolar disorder. It has no established benefit for borderline personality disorder."}, "explanation": "This is borderline personality disorder: unstable relationships alternating between idealization and devaluation, chronic emptiness, impulsivity, and recurrent self-harm. The treatment with the best evidence is psychotherapy, especially dialectical behavior therapy (DBT), which combines CBT techniques with mindfulness, distress tolerance, emotion regulation, and interpersonal effectiveness skills. Medication is used only for specific symptoms.", "objective": "DBT is the first-line treatment for borderline personality disorder.", "error_hint": "Students reach for a medication. For borderline personality disorder, psychotherapy is the mainstay and drugs only treat target symptoms.", "explanation_short": ""}, {"stem": "A resident tells his attending that a hospitalized patient praised him as the only doctor who really listens and criticized the nurses as uncaring. The following day the patient told the resident he was incompetent and asked for a different doctor, while praising a nurse as wonderful. Which of the following defense mechanisms is the patient most likely using?", "options": ["Denial", "Undoing", "Splitting", "Projection", "Reaction formation"], "answer": 2, "wrong": {"A": "Denial refuses to accept a painful reality. Nothing here is denied.", "B": "Undoing is performing an act that symbolically reverses an unacceptable thought or deed.", "D": "Projection attributes one's own unacceptable feelings to others.", "E": "Reaction formation expresses the opposite of an unacceptable impulse, for example excessive kindness toward someone one dislikes."}, "explanation": "Splitting is the immature defense in which a person sees others as all good or all bad and may change abruptly from one to the other. It is the hallmark defense of borderline personality disorder and often divides a treatment team into rescuers and persecutors.", "objective": "Splitting is the characteristic defense of borderline personality disorder, seen as rapid shifts between idealizing and devaluing people.", "error_hint": "Students choose projection because the patient blames others. The key is the swing between all-good and all-bad views of different people.", "explanation_short": ""}, {"stem": "A 19-year-old man is arrested for stealing a car. His mother says that at age 12 he began skipping school, was repeatedly suspended for fighting, and set fires in the neighborhood; at 14 he hurt a neighbor's dog and showed no regret. He has been fired from two jobs for lying. When the police officer asks how he feels about the victim, he shrugs and says, \"He should have locked his car.\" Which of the following is the most likely diagnosis?", "options": ["Narcissistic personality disorder", "Antisocial personality disorder", "Oppositional defiant disorder", "Borderline personality disorder", "Conduct disorder"], "answer": 1, "wrong": {"A": "Narcissistic patients seek admiration and feel entitled. A callous disregard for others' rights is not the central feature.", "C": "ODD involves defiance of authority without serious violation of others' rights, and it does not include fire-setting or cruelty to animals.", "D": "Borderline patients have unstable relationships and self-image with self-harm. Those are not described.", "E": "Conduct disorder is diagnosed in patients under 18. At 19, when the criteria for antisocial personality disorder are met, that is the diagnosis."}, "explanation": "Antisocial personality disorder is a pervasive pattern of disregard for and violation of others' rights, with deceitfulness, impulsivity, aggression, and lack of remorse. It requires the patient to be at least 18 years old and to have had evidence of conduct disorder before age 15. This 19-year-old fits both requirements.", "objective": "Antisocial personality disorder: age at least 18, with conduct disorder before age 15.", "error_hint": "Students stay with conduct disorder because of the childhood history. After 18, the adult diagnosis applies if criteria are met.", "explanation_short": ""}, {"stem": "A 29-year-old woman is brought to the clinic by a friend. She arrives in a tight, brightly colored outfit and describes her recent breakup with exaggerated gestures and dramatic language, but when asked for details she is vague. She says that she and her new co-worker are \"very close\" though they have only spoken twice. She becomes visibly upset when the physician turns his attention to his computer. She has no self-harm, no episodes of sustained elevated mood, and no abrupt idealization or devaluation of her relationships. Which of the following is the most likely diagnosis?", "options": ["Histrionic personality disorder", "Borderline personality disorder", "Narcissistic personality disorder", "Bipolar I disorder, manic episode", "Dependent personality disorder"], "answer": 0, "wrong": {"B": "Borderline patients have unstable relationships and identity with self-harm and anger, which are not described.", "C": "Narcissistic patients are grandiose, require admiration, and lack empathy. Her behavior is driven by the need for attention.", "D": "Mania is episodic with decreased need for sleep, pressured speech, and grandiosity. Hers is a long-standing pattern.", "E": "Dependent patients are submissive and cannot make decisions alone. She is dramatic and attention-seeking."}, "explanation": "Histrionic personality disorder involves excessive emotionality and attention-seeking: dramatic, theatrical expression, shallow and rapidly shifting emotions, impressionistic speech lacking detail, provocative behavior, and a tendency to consider relationships more intimate than they are. These patients are uncomfortable when they are not the center of attention.", "objective": "Histrionic personality disorder: attention-seeking, dramatic, shallow shifting emotions, vague speech.", "error_hint": "Students pick borderline because of emotional intensity. Lack of self-harm and idealization/devaluation, plus the focus on being noticed, favors histrionic.", "explanation_short": ""}, {"stem": "A 52-year-old executive is admitted after a myocardial infarction. He tells the nurse that he must be treated by the chief of cardiology because the other physicians are beneath him. He expects staff to respond immediately to his requests and complains that the nurses do not appreciate who he is. When the cardiologist explains that he must follow the same rehabilitation program as other patients, the patient angrily belittles the cardiologist's training. Which of the following is the most likely diagnosis?", "options": ["Obsessive-compulsive personality disorder", "Antisocial personality disorder", "Histrionic personality disorder", "Narcissistic personality disorder", "Borderline personality disorder"], "answer": 3, "wrong": {"A": "OCPD involves perfectionism and rigid control. His behavior is driven by entitlement.", "B": "Antisocial patients violate others' rights and lack remorse, with a childhood history of conduct problems. This vignette is about entitlement and grandiosity.", "C": "Histrionic patients seek attention through drama and seductiveness rather than grandiosity.", "E": "Borderline patients show unstable relationships, self-harm, and abrupt shifts. They are not defined by entitlement."}, "explanation": "Narcissistic personality disorder includes a grandiose sense of self-importance, a need for admiration, entitlement, and a lack of empathy. These patients seek special treatment and react to perceived criticism (narcissistic injury) with rage or contempt. The demand for the 'best' physician and the belittling of others are typical.", "objective": "Narcissistic personality disorder: grandiosity, entitlement, need for admiration, rage when criticized.", "error_hint": "Students confuse narcissistic with antisocial because both lack empathy. The defining feature here is entitlement and a need to be seen as special.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
