<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Patient safety and quality improvement — practice questions</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--dim:#5b6475;--bd:#d9dde8;--ac:#4f46e5;--ok:#15803d;--okb:#e7f6ec;--bad:#b91c1c;--badb:#fdecec;--hint:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--dim:#9aa3b8;--bd:#2c3140;--ac:#818cf8;--ok:#4ade80;--okb:#12301e;--bad:#f87171;--badb:#341818;--hint:#2f2a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:700}
.lock{font-size:.78em;color:var(--dim)}
h1{font-size:1.45em;margin:.2em 0 .1em}
.sub{color:var(--dim);font-size:.9em;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.qn{font-weight:700;color:var(--ac);font-size:.85em;margin-bottom:4px}
.stem{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-top:5px}.opt .l{font-weight:700;min-width:1.2em}
.q.done .opt{cursor:default}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin:4px 0 0 0;font-size:.88em;color:var(--dim)}
.opt.right .why,.opt.wrong .why{color:var(--tx)}
.res{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.q.done .res{display:block}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.92em}
.obj{background:var(--okb)}.err{background:var(--hint)}
.lbl{font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);display:block}
.flags{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:.9em}
.flags h2{font-size:1em;margin:0 0 6px}.flags li{margin:4px 0}
.fin{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:14px;margin:14px 0;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 6</span><span class="lock">Gap-topic practice</span></div>
<h1>Patient safety and quality improvement</h1><div class="sub">US Health Care System · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "A patient undergoes surgery on the wrong knee. The hospital's patient safety committee meets to review the event. Which of the following is the most appropriate approach?", "options": ["No review because the event was unavoidable", "Review only the surgeon's training record", "A root cause analysis to identify the system failures that allowed the error", "Identify the surgeon and impose a penalty without further review", "Settle with the patient and avoid documenting the event"], "answer": 2, "wrong": {"A": "Wrong-site surgery is preventable with processes such as site marking and a surgical time-out.", "B": "Looking only at one person misses system contributors.", "D": "Blaming individuals alone discourages reporting and does not fix the process.", "E": "Concealing events prevents learning and breaches disclosure obligations."}, "explanation": "Wrong-site surgery is a sentinel event, an unexpected event causing serious harm. The recommended response is a root cause analysis, a systematic, non-punitive review to find the underlying system and process failures (communication, marking, time-outs, checklists) and implement corrective changes. A just culture focuses on fixing systems rather than only blaming individuals.", "objective": "Sentinel events require root cause analysis focused on systems, not blame.", "error_hint": "Students look for the responsible person. Quality improvement focuses on how the system allowed the error.", "explanation_short": ""}, {"stem": "A pharmacist notices that a physician prescribed ten times the intended dose of a medication. She contacts the physician, who corrects the order before the medication is dispensed. The patient is unaffected. Which of the following best describes this event?", "options": ["Never event", "Side effect", "Adverse event", "Sentinel event", "Near miss"], "answer": 4, "wrong": {"A": "A 'never event' is a serious, largely preventable event that should never occur (such as wrong-site surgery), and this one did not reach the patient.", "B": "A side effect is a known drug effect, not an error.", "C": "An adverse event is harm caused to the patient by care.", "D": "A sentinel event involves death or serious harm."}, "explanation": "A near miss is an error or hazardous situation that is caught before it reaches the patient, so there is no harm. Near misses should be reported and analyzed, because they reveal the same system weaknesses as events that cause harm.", "objective": "A near miss is an error intercepted before reaching the patient.", "error_hint": "Students call any error an adverse event. If it never reached the patient there was no harm.", "explanation_short": ""}, {"stem": "A hospital unit introduces a new structured handoff checklist. The team tests it for 2 weeks on one ward, reviews the results, changes the checklist according to the staff's feedback, and then tests the revised version on a second ward. Which of the following quality improvement models is being used?", "options": ["Plan-Do-Study-Act cycle", "Failure mode and effects analysis", "Cost-benefit analysis", "Root cause analysis", "Swiss cheese model"], "answer": 0, "wrong": {"B": "FMEA is a prospective analysis of how a process might fail and the effect of each failure.", "C": "Cost-benefit analysis compares costs with monetary benefits.", "D": "Root cause analysis is a retrospective review after an event.", "E": "The Swiss cheese model explains how errors pass through aligned weaknesses in multiple defenses; it is not an improvement cycle."}, "explanation": "The Plan-Do-Study-Act (PDSA) cycle is an iterative method of testing a change on a small scale, studying the results, and acting by adopting, adapting, or abandoning the change. It is the core method of the Model for Improvement.", "objective": "PDSA is the iterative test-and-adapt cycle of quality improvement.", "error_hint": "Students choose root cause analysis because it is more familiar. This team is testing a change prospectively.", "explanation_short": ""}, {"stem": "A resident prescribes the wrong medication and the patient develops a mild transient rash that resolves with treatment. The attending is deciding how to inform the patient. Which of the following is the most appropriate approach?", "options": ["Tell no one unless the patient complains", "Disclose the error promptly to the patient, explain what happened, apologize, and describe how recurrence will be prevented", "Document it only in the risk management file", "Wait for a final lab result before telling the patient anything", "Blame the pharmacy"], "answer": 1, "wrong": {"A": "Hiding an error violates the duty of honesty.", "C": "Documenting only internally does not satisfy the duty to inform the patient.", "D": "Delaying disclosure undermines trust and the ability to treat.", "E": "Shifting blame is dishonest and unhelpful."}, "explanation": "Physicians have an ethical obligation to disclose medical errors to patients, even when harm is minor. Disclosure should be prompt, honest, and include an explanation, an apology, and a plan to prevent recurrence. Concealment violates trust and professional ethics, and disclosure and apology reduce rather than increase the likelihood of litigation.", "objective": "Disclose medical errors promptly and honestly, with an apology and an explanation of corrective steps.", "error_hint": "Students fear liability and withhold information. Honesty is both required and protective.", "explanation_short": ""}, {"stem": "A hospital pharmacy repeatedly sees wrong-route errors in which a drug meant for intravenous use is given intrathecally. Which of the following interventions would be most effective, according to the hierarchy of error-prevention strategies?", "options": ["Posting reminders in the pharmacy", "Educating staff at an annual meeting", "Asking staff to be more careful", "Redesigning syringes and connectors so that intravenous and intrathecal devices cannot be connected", "Disciplining staff who make errors"], "answer": 3, "wrong": {"A": "Reminders and signs are weak interventions.", "B": "Education is a weak intervention that depends on memory.", "C": "Asking people to be careful relies on vigilance, which fails under stress and fatigue.", "E": "Punishment discourages reporting and does not fix the system."}, "explanation": "Strong interventions eliminate the possibility of the error by design: forcing functions, standardization, and automation (for example, incompatible connectors). Weaker interventions rely on human memory and vigilance, such as education, reminders, and policies. Discipline is the weakest and discourages reporting.", "objective": "Forcing functions and system redesign are the strongest error-prevention strategies; education and reminders are weak.", "error_hint": "Students choose education because it is the common response. The strongest approach removes the opportunity to err.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
