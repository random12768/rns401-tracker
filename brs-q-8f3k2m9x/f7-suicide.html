<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Suicide risk assessment — practice questions</title><style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--dim:#5b6475;--bd:#d9dde8;--ac:#4f46e5;--ok:#15803d;--okb:#e7f6ec;--bad:#b91c1c;--badb:#fdecec;--hint:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#e8eaf2;--dim:#9aa3b8;--bd:#2c3140;--ac:#818cf8;--ok:#4ade80;--okb:#12301e;--bad:#f87171;--badb:#341818;--hint:#2f2a14}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.badge{background:var(--ac);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78em;font-weight:700}
.lock{font-size:.78em;color:var(--dim)}
h1{font-size:1.45em;margin:.2em 0 .1em}
.sub{color:var(--dim);font-size:.9em;margin-bottom:12px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar .sc{font-weight:700}.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px}
button.main{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.5;cursor:default}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.qn{font-weight:700;color:var(--ac);font-size:.85em;margin-bottom:4px}
.stem{margin:0 0 10px}
.opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt input{margin-top:5px}.opt .l{font-weight:700;min-width:1.2em}
.q.done .opt{cursor:default}
.opt.right{background:var(--okb);border-color:var(--ok)}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.why{margin:4px 0 0 0;font-size:.88em;color:var(--dim)}
.opt.right .why,.opt.wrong .why{color:var(--tx)}
.res{display:none;margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}
.q.done .res{display:block}
.verdict{font-weight:700;margin-bottom:6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.box{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:.92em}
.obj{background:var(--okb)}.err{background:var(--hint)}
.lbl{font-weight:700;font-size:.78em;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);display:block}
.flags{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:18px 0;font-size:.9em}
.flags h2{font-size:1em;margin:0 0 6px}.flags li{margin:4px 0}
.fin{display:none;background:var(--card);border:2px solid var(--ac);border-radius:12px;padding:14px;margin:14px 0;text-align:center;font-weight:700}
</style></head><body><div class="wrap">
<div class="top"><span class="badge">Final topic 7</span><span class="lock">Gap-topic practice</span></div>
<h1>Suicide risk assessment</h1><div class="sub">Final topics without a video · 5 NBME-style questions · pick an answer, then check it to see the full reasoning</div>
<div class="bar"><span class="sc" id="sc"></span><button onclick="reset()">Restart</button></div>
<div id="qs"></div><div class="fin" id="fin"></div></div><script>
const Q=[{"stem": "Five patients are evaluated in the emergency department for depression. Which of them has the highest risk of completed suicide?", "options": ["A 35-year-old woman with a first episode of mild depression who is worried about work", "A 17-year-old girl who took 5 acetaminophen tablets after an argument and regrets it", "A 23-year-old woman with borderline personality disorder who has superficially cut her wrists, denies any plan, and has supportive friends", "A 45-year-old woman with panic disorder who is afraid of dying", "A 72-year-old widower with depression who drinks daily, keeps a loaded firearm at home, says he is a burden, and has a plan"], "answer": 4, "wrong": {"A": "A first mild episode without suicidal ideation is lower risk.", "B": "An impulsive low-lethality attempt with regret has lower lethality, though adolescents need close evaluation.", "C": "Self-harm with a supportive network and no plan is a lower acute risk, though it needs treatment.", "D": "Panic disorder causes fear of dying, not suicidal intent."}, "explanation": "Risk factors for completed suicide include male sex, older age, white race, widowed or divorced status, depression, alcohol or substance use, access to lethal means (especially firearms), a specific plan, hopelessness or feeling like a burden, and a previous attempt. Women attempt more often, but men complete more often because they use more lethal methods. Older white men have the highest rate.", "objective": "Highest risk: older white male, widowed, depressed, with substance use, a firearm, and a plan.", "error_hint": "Students choose the patient with the most recent attempt. Lethality of method and access to means weigh heavily.", "explanation_short": ""}, {"stem": "A medical student asks whether it is dangerous to ask depressed patients directly about suicide because it might put the idea in their heads. Which of the following is the most accurate response?", "options": ["Questions should be asked only if the patient brings up suicide first", "Asking increases the risk of suicidal behavior, so it should be avoided", "Family members should be asked first", "Direct questions about thoughts, plans, intent, and access to means do not increase risk and are an essential part of the assessment", "Questions about suicide should be left to a psychiatrist"], "answer": 3, "wrong": {"A": "Waiting for the patient to raise it misses at-risk patients who are reluctant to disclose.", "B": "This is a common myth; evidence does not support it.", "C": "The patient is the primary source, though collateral information is useful.", "E": "All physicians should assess suicide risk."}, "explanation": "Asking directly about suicidal ideation does not plant the idea or increase risk, and it often provides relief. The assessment should cover ideation, plan, intent, access to lethal means, prior attempts, protective factors, and substance use.", "objective": "Ask directly about suicide; doing so does not increase risk.", "error_hint": "Students fear causing harm. Silence is the greater risk.", "explanation_short": ""}, {"stem": "A 40-year-old man with major depression tells his physician that he plans to take all of his pills tonight and has already gathered them at home. He says there is no reason to go on and refuses to be admitted to the hospital. Which of the following is the most appropriate action?", "options": ["Prescribe a 30-day supply of an SSRI and arrange follow-up in 2 weeks", "Refer him to outpatient psychotherapy", "Arrange involuntary psychiatric hospitalization", "Ask his family to watch him at home", "Obtain a no-suicide contract and schedule a visit in 1 month"], "answer": 2, "wrong": {"A": "SSRIs take weeks to work, and a 30-day supply gives him means for overdose.", "B": "Outpatient referral does not protect him tonight.", "D": "Home supervision is not adequate for imminent risk.", "E": "No-suicide contracts are not reliable, and delayed follow-up is unsafe."}, "explanation": "A patient with a specific, imminent plan, intent, and means, who refuses voluntary admission, is an imminent danger to himself. The physician should arrange emergency (involuntary) psychiatric hospitalization, which is an exception to the usual requirement for informed consent. No-suicide contracts have not been shown to prevent suicide.", "objective": "Imminent suicide risk with a plan and refusal of care requires involuntary hospitalization.", "error_hint": "Students respect refusal. Imminent danger to self overrides autonomy.", "explanation_short": ""}, {"stem": "A 30-year-old man with schizophrenia has made three suicide attempts despite adequate trials of risperidone and olanzapine. Which of the following medications has the best evidence for reducing suicidal behavior in this patient?", "options": ["Haloperidol", "Clozapine", "Fluphenazine", "Ziprasidone", "Lorazepam"], "answer": 1, "wrong": {"A": "Haloperidol has no evidence of reducing suicidality.", "C": "Fluphenazine is a typical antipsychotic without such evidence.", "D": "Ziprasidone is not shown to reduce suicidality.", "E": "Benzodiazepines do not treat the underlying risk and can disinhibit."}, "explanation": "Clozapine is the only antipsychotic with evidence that it reduces suicidal behavior in schizophrenia and schizoaffective disorder, and it is also used for treatment-resistant illness. It requires monitoring of neutrophil counts for agranulocytosis, and attention to seizures, myocarditis, and metabolic effects. Lithium reduces suicide risk in bipolar disorder.", "objective": "Clozapine reduces suicidal behavior in schizophrenia; lithium does so in bipolar disorder.", "error_hint": "Students pick any antipsychotic. Clozapine has specific evidence.", "explanation_short": ""}, {"stem": "A physician is evaluating the risk factors of a patient who has recently made a suicide attempt. Which of the following factors is generally considered the strongest single predictor of a future completed suicide?", "options": ["A previous suicide attempt", "Alcohol use", "Insomnia", "Unemployment", "Self-reported anxiety"], "answer": 0, "wrong": {"B": "Alcohol use is associated with increased risk but is weaker than a prior attempt.", "C": "Insomnia is a risk factor but less strongly predictive.", "D": "Unemployment adds risk but is weaker.", "E": "Anxiety alone is not the strongest predictor."}, "explanation": "A previous suicide attempt is the strongest single predictor of a future completed suicide. Other important factors include psychiatric illness (depression, bipolar disorder, schizophrenia), substance use, hopelessness, access to means, and recent loss.", "objective": "A prior suicide attempt is the strongest single predictor of completed suicide.", "error_hint": "Students choose current illness severity. A prior attempt carries the most predictive weight.", "explanation_short": ""}];let ans={},chk={};
const L='ABCDE';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){const m=document.getElementById('qs');m.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.id='q'+i;
let h='<div class="qn">Question '+(i+1)+' of '+Q.length+'</div><p class="stem">'+esc(q.stem)+'</p>';
q.options.forEach((o,j)=>{h+='<label class="opt" id="o'+i+'_'+j+'"><input type="radio" name="q'+i+'" value="'+j+'" onchange="pick('+i+','+j+')"><span class="l">'+L[j]+'.</span><span class="t">'+esc(o)+'<div class="why" style="display:none"></div></span></label>'});
h+='<div style="margin-top:8px"><button class="main" id="b'+i+'" onclick="check('+i+')" disabled>Check answer</button></div><div class="res" id="r'+i+'"></div>';
d.innerHTML=h;m.appendChild(d)});upd()}
function pick(i,j){if(chk[i])return;ans[i]=j;document.getElementById('b'+i).disabled=false}
function check(i){const q=Q[i];if(chk[i]||ans[i]===undefined)return;chk[i]=1;const c=q.answer,a=ans[i];
const d=document.getElementById('q'+i);d.classList.add('done');
q.options.forEach((o,j)=>{const el=document.getElementById('o'+i+'_'+j);el.querySelector('input').disabled=true;
const w=el.querySelector('.why');
if(j===c){el.classList.add('right');w.textContent='Correct answer.';w.style.display='block'}
else{const t=q.wrong[L[j]];if(t){w.textContent=t;w.style.display='block'}if(j===a)el.classList.add('wrong')}});
let r='<div class="verdict '+(a===c?'ok':'no')+'">'+(a===c?'Correct':'Incorrect — the answer is '+L[c])+'</div>';
r+='<div><span class="lbl">Full explanation of the reasoning</span>'+esc(q.explanation)+'</div>';
r+='<div class="box obj"><span class="lbl">Educational objective</span>'+esc(q.objective)+'</div>';
if(a!==c)r+='<div class="box err"><span class="lbl">Likely reasoning error</span>'+esc(q.error_hint)+'</div>';
document.getElementById('r'+i).innerHTML=r;document.getElementById('b'+i).style.display='none';upd();
if(Object.keys(chk).length===Q.length){const f=document.getElementById('fin');f.style.display='block';f.textContent='Finished: '+sc()+' / '+Q.length+' correct'}}
function sc(){let s=0;for(const i in chk)if(ans[i]===Q[i].answer)s++;return s}
function upd(){document.getElementById('sc').textContent='Answered '+Object.keys(chk).length+' / '+Q.length+' · Score '+sc()}
function reset(){ans={};chk={};document.getElementById('fin').style.display='none';render();window.scrollTo(0,0)}
render();
</script></body></html>
